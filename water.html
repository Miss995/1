<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a1520">
<title>涟漪 · 摸一下</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; background:#0a1520; overflow:hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none; }
  #c { display:block; width:100vw; height:100vh; }

  #panel {
    position:fixed; left:12px; right:12px; bottom:12px;
    background: rgba(12,22,32,.72);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border:1px solid rgba(160,210,255,.16);
    border-radius:18px;
    color:#cfe4f5; font-size:12px;
    padding:10px 14px 12px;
    max-height:52vh; overflow-y:auto;
    transition: transform .25s ease, opacity .25s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  #panel.hide { transform: translateY(120%); opacity:0; pointer-events:none; }

  .hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .hd b { font-size:13px; letter-spacing:.06em; color:#e6f2ff; font-weight:600; }
  .hd span { opacity:.55; font-size:11px; }

  .row { display:flex; align-items:center; gap:10px; margin:7px 0; }
  .row label { flex:0 0 52px; opacity:.72; font-size:11.5px; }
  .row input[type=range] { flex:1; -webkit-appearance:none; height:22px; background:transparent; }
  .row input[type=range]::-webkit-slider-runnable-track {
    height:3px; border-radius:2px;
    background: linear-gradient(90deg, rgba(120,190,255,.75), rgba(120,190,255,.18));
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:15px; height:15px; margin-top:-6px;
    border-radius:50%; background:#bfe1ff;
    box-shadow:0 0 10px rgba(140,200,255,.75), 0 1px 3px rgba(0,0,0,.5);
  }
  .row .val { flex:0 0 36px; text-align:right; font-variant-numeric: tabular-nums; opacity:.85; font-size:11px; }

  .btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button {
    flex:1 1 auto; min-width:70px;
    background: rgba(120,190,255,.10);
    border:1px solid rgba(140,200,255,.24);
    color:#cfe4f5; border-radius:11px; padding:8px 10px;
    font-size:11.5px; font-family:inherit; cursor:pointer;
  }
  button:active { background: rgba(120,190,255,.26); }
  button.on { background: rgba(120,190,255,.30); border-color: rgba(160,215,255,.55); color:#fff; }

  #tip {
    position:fixed; top:16px; left:0; right:0; text-align:center;
    color:rgba(210,232,250,.55); font-size:12px; letter-spacing:.2em;
    pointer-events:none; transition:opacity .8s;
  }
  #toggle {
    position:fixed; top:12px; right:12px; z-index:5;
    width:36px; height:36px; border-radius:50%;
    background: rgba(12,22,32,.6); border:1px solid rgba(160,210,255,.2);
    color:#cfe4f5; font-size:15px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip">点 一 下 水 面</div>
<div id="toggle">≡</div>

<div id="panel">
  <div class="hd"><b>涟漪参数</b><span>左上有光源</span></div>

  <div class="row"><label>波长</label><input id="s_pitch" type="range" min="80"  max="900" value="380"><span class="val" id="v_pitch">380</span></div>
  <div class="row"><label>扩散</label><input id="s_front" type="range" min="6"   max="60"  value="28"><span class="val" id="v_front">28</span></div>
  <div class="row"><label>消散</label><input id="s_decay" type="range" min="30"  max="250" value="110"><span class="val" id="v_decay">110</span></div>
  <div class="row"><label>折射</label><input id="s_refr"  type="range" min="0"   max="100" value="40"><span class="val" id="v_refr">40</span></div>
  <div class="row"><label>坡度</label><input id="s_norm"  type="range" min="0"   max="300" value="100"><span class="val" id="v_norm">100</span></div>
  <div class="row"><label>锐度</label><input id="s_shine" type="range" min="2"   max="200" value="80"><span class="val" id="v_shine">80</span></div>
  <div class="row"><label>高光</label><input id="s_spec"  type="range" min="0"   max="200" value="90"><span class="val" id="v_spec">90</span></div>
  <div class="row"><label>透光</label><input id="s_trans" type="range" min="0"   max="150" value="55"><span class="val" id="v_trans">55</span></div>
  <div class="row"><label>光斑</label><input id="s_caus"  type="range" min="0"   max="150" value="60"><span class="val" id="v_caus">60</span></div>

  <div class="btns">
    <button data-bg="grid" class="on">格子底</button>
    <button data-bg="dots">圆点底</button>
    <button data-bg="stripes">彩条底</button>
  </div>
  <div class="btns">
    <button id="b_wave">大浪 关</button>
    <button id="b_pause">继续</button>
  </div>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform float uPitch;
uniform float uFront;
uniform float uDecay;
uniform float uRefr;
uniform float uNorm;
uniform float uShine;
uniform float uSpecPow;
uniform float uTrans;
uniform float uCaustic;
uniform float uTint;
uniform float uBg;
uniform float uWave;

uniform vec4 uRipples[6];

float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.52;
    mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
    for (int i = 0; i < 3; i++) {
        v += a * vnoise(p);
        p = rot * p * 2.07;
        a *= 0.5;
    }
    return v;
}

// ---------- 水底 ----------
vec3 underGrid(vec2 uv) {
    vec3 col = mix(vec3(0.055,0.115,0.170), vec3(0.150,0.245,0.320), uv.y);
    vec2 g = abs(fract(uv * vec2(9.0, 15.0)) - 0.5);
    float line = smoothstep(0.455, 0.500, max(g.x, g.y));
    col += line * vec3(0.42, 0.58, 0.70) * 0.62;
    float r = smoothstep(0.10, 0.0, length(uv - vec2(0.24, 0.68)));
    col += r * vec3(0.62, 0.74, 0.82) * 0.50;
    float r2 = smoothstep(0.16, 0.0, length(uv - vec2(0.78, 0.28)));
    col += r2 * vec3(0.48, 0.42, 0.36) * 0.55;
    return col;
}

vec3 underDots(vec2 uv) {
    vec3 col = mix(vec3(0.080,0.105,0.150), vec3(0.170,0.215,0.285), uv.y);
    vec2 cell = fract(uv * vec2(11.0, 17.0)) - 0.5;
    float d = smoothstep(0.21, 0.13, length(cell));
    float hue = fract(uv.x * 0.9 + uv.y * 0.55);
    vec3 dotc = mix(vec3(0.72,0.84,0.96), vec3(0.65,0.70,0.92), hue);
    col += d * dotc * 0.62;
    return col;
}

vec3 underStripes(vec2 uv) {
    float s = sin(uv.x * 14.0 + uv.y * 3.0);
    vec3 a = vec3(0.34,0.48,0.62);
    vec3 b = vec3(0.58,0.50,0.68);
    vec3 col = mix(a, b, s * 0.5 + 0.5) * mix(0.55, 1.0, uv.y);
    vec2 g = abs(fract(uv * vec2(6.0, 10.0)) - 0.5);
    float line = smoothstep(0.47, 0.50, max(g.x, g.y));
    col += line * vec3(0.80, 0.88, 0.98) * 0.34;
    return col;
}

vec3 under(vec2 uv) {
    if (uBg < 0.5)      return underGrid(uv);
    else if (uBg < 1.5) return underDots(uv);
    else                return underStripes(uv);
}

// ---------- 大浪 ----------
float waterHeight(vec2 p, float t) {
    float h = 0.0;
    h += fbm(p * 0.55 + vec2( t * 0.10, t * 0.06)) * 1.00;
    h += fbm(p * 1.50 - vec2( t * 0.18,-t * 0.12)) * 0.48;
    return h;
}

// ---------- 涟漪 ----------
float rippleH(vec2 uv, float t) {
    float h = 0.0;
    float aspect = uRes.x / uRes.y;
    for (int i = 0; i < 6; i++) {
        vec4 r = uRipples[i];
        if (r.w <= 0.001) continue;
        float age = t - r.z;
        if (age < 0.0 || age > 3.2) continue;

        vec2 d = uv - r.xy;
        d.x *= aspect;
        float dist = length(d);

        float front = age * uFront;
        float tail = smoothstep(front - 0.10, front, dist);
        float head = exp(-pow(max(dist - front, 0.0) * 12.0, 2.0));
        float ring = tail * head;
        float fall = exp(-age * uDecay);

        float k0 = uPitch * exp(-age * 0.90);
        float r0 = 0.10 + age * 0.10;
        float phase = k0 * r0 * log(1.0 + dist / r0);

        h += sin(phase) * ring * fall * r.w;
        h += exp(-pow(dist * 26.0, 2.0)) * exp(-age * 6.0) * r.w * 1.6;
    }
    return h;
}

void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    float aspect = uRes.x / uRes.y;
    float t = uTime;
    vec2 p = (uv - 0.5) * vec2(aspect, 1.0);

    // 光源在画面外左上，往右下照
    vec3 L = normalize(vec3(-0.46, 0.58, 0.67));
    vec3 V = vec3(0.0, 0.0, 1.0);
    vec3 lightCol = vec3(1.0, 0.97, 0.90);

    // 大浪（默认关）
    vec2 gWave = vec2(0.0);
    float hWave = 0.5;
    if (uWave > 0.5) {
        float e = 0.006;
        vec2 pp = p * 2.5;
        float h0 = waterHeight(pp, t);
        float hx = waterHeight(pp + vec2(e, 0.0), t);
        float hy = waterHeight(pp + vec2(0.0, e), t);
        gWave = vec2(hx - h0, hy - h0) / e;
        hWave = h0;
    }

    // 涟漪高度与梯度
    float re = 0.0006;
    float rH = rippleH(uv, uTime);
    float rx = rippleH(uv + vec2(re, 0.0), uTime);
    float ry = rippleH(uv + vec2(0.0, re), uTime);
    vec2 gRip = vec2(rx - rH, ry - rH) / re;

    // 折射位移
    vec2 off = gRip * uRefr * 0.00006 + gWave * uWave * 0.0008;
    vec2 uvw = uv + off;

    // ---- 水底（透亮的关键：底下被光照亮） ----
    vec3 col = under(uvw);

    // 水里的光斑：跟着折射一起动，像光穿过水面打在水底
    vec2 cp = uvw * vec2(6.5, 10.5) + vec2(t * 0.11, t * 0.07);
    float caus = pow(vnoise(cp), 4.0) * 3.2;
    caus += pow(vnoise(cp * 1.9 + 13.0), 6.0) * 2.4;
    col += caus * uCaustic * vec3(0.55, 0.82, 0.98);

    // 水色：薄薄一层蓝，不能压死底下的东西
    vec3 waterCol = vec3(0.13, 0.36, 0.46);
    col = mix(col, col * waterCol * 2.2, uTint * 0.16);

    // ---- 水面法线 ----
    vec3 n = normalize(vec3(-(gRip * uNorm * 0.0040 + gWave * uWave * 0.45), 1.0));

    // ---- ① 高光：光源在水面的碎倒影 ----
    vec3 Hv = normalize(L + V);
    float spec = pow(max(dot(n, Hv), 0.0), uShine);
    col += spec * uSpecPow * lightCol;

    // ---- ② 透光：波峰薄的地方，光穿过去 ----
    float crestH = max(rH, 0.0) * 0.5 + 0.5;
    float trans = pow(max(dot(n, L), 0.0), 1.5) * smoothstep(-0.05, 0.95, crestH);
    col += trans * uTrans * vec3(0.52, 0.80, 0.96);

    // ---- ③ 极弱的整体环境反光（俯视只有百分之几，不该看得见） ----
    vec3 R = reflect(-V, n);
    float rim = pow(1.0 - max(dot(n, V), 0.0), 5.0);
    col += rim * smoothstep(-0.1, 0.9, R.y) * 0.12 * vec3(0.40, 0.62, 0.86);

    // ---- 暗角 ----
    vec2 vg = uv - 0.5;
    float vig = smoothstep(0.98, 0.24, length(vg * vec2(1.0, 0.92)));
    col *= mix(0.70, 1.0, vig);

    // ---- 色调映射（往亮里拉） ----
    col = col / (col + vec3(0.70));
    col = pow(col, vec3(0.84));

    gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function(){
  const cvs = document.getElementById('c');
  const gl = cvs.getContext('webgl', { antialias:false, alpha:false, powerPreference:'high-performance' })
          || cvs.getContext('experimental-webgl');
  if (!gl) {
    document.body.innerHTML = '<div style="color:#cfe4f5;padding:40px;font-size:14px">这台设备不给 WebGL，看不成了。</div>';
    return;
  }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('SHADER ERR:', gl.getShaderInfoLog(s));
      document.title = 'SHADER ERR';
    }
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,   document.getElementById('vs').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('LINK ERR:', gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['uRes','uTime','uPitch','uFront','uDecay','uRefr','uNorm','uShine',
   'uSpecPow','uTrans','uCaustic','uTint','uBg','uWave']
    .forEach(n => U[n] = gl.getUniformLocation(prog, n));
  U.uRipples = gl.getUniformLocation(prog, 'uRipples');

  const S = { pitch:380, front:28, decay:110, refr:40, norm:100,
              shine:80, spec:90, trans:55, caus:60, bg:0, wave:0 };
  let paused = true, tAcc = 2.0, last = performance.now();
  let needDraw = true;

  const RIP_N = 6;
  const ripples = new Float32Array(RIP_N * 4);
  let ripIdx = 0, lastRipTime = 0;

  function addRipple(u, v, strength) {
    const now = tAcc;
    if (now - lastRipTime < 0.055) return;
    lastRipTime = now;
    const i = ripIdx % RIP_N;
    ripIdx++;
    ripples[i*4+0] = u;
    ripples[i*4+1] = v;
    ripples[i*4+2] = now;
    ripples[i*4+3] = strength;
  }

  function uvFromEvent(e) {
    const r = cvs.getBoundingClientRect();
    return [ (e.clientX - r.left) / r.width, 1.0 - (e.clientY - r.top) / r.height ];
  }

  let down = false;
  cvs.addEventListener('pointerdown', e => {
    down = true;
    if (paused) {
      paused = false; needDraw = true;
      const _bp = document.getElementById('b_pause');
      _bp.textContent = '暂停'; _bp.classList.remove('on');
    }
    const [u,v] = uvFromEvent(e);
    addRipple(u, v, 1.0);
    lastRipTime = 0;
  });
  cvs.addEventListener('pointermove', e => {
    if (!down) return;
    const [u,v] = uvFromEvent(e);
    addRipple(u, v, 0.75);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t =>
    cvs.addEventListener(t, () => { down = false; })
  );

  function bind(id, key) {
    const el = document.getElementById('s_' + id);
    const out = document.getElementById('v_' + id);
    const upd = () => { S[key] = +el.value; out.textContent = el.value; needDraw = true; };
    el.addEventListener('input', upd);
    upd();
  }
  bind('pitch','pitch'); bind('front','front'); bind('decay','decay');
  bind('refr','refr');   bind('norm','norm');   bind('shine','shine');
  bind('spec','spec');   bind('trans','trans'); bind('caus','caus');

  document.querySelectorAll('[data-bg]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      S.bg = { grid:0, dots:1, stripes:2 }[btn.dataset.bg];
      needDraw = true;
    });
  });

  const bw = document.getElementById('b_wave');
  bw.addEventListener('click', () => {
    S.wave = S.wave > 0.5 ? 0 : 1;
    bw.textContent = S.wave > 0.5 ? '大浪 开' : '大浪 关';
    bw.classList.toggle('on', S.wave > 0.5);
    needDraw = true;
  });

  const bp = document.getElementById('b_pause');
  bp.addEventListener('click', () => {
    paused = !paused;
    bp.textContent = paused ? '继续' : '暂停';
    bp.classList.toggle('on', paused);
    needDraw = true;
  });

  const panel = document.getElementById('panel');
  document.getElementById('toggle').addEventListener('click', () => panel.classList.toggle('hide'));
  const tip = document.getElementById('tip');
  setTimeout(() => { tip.style.opacity = '0'; }, 3200);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1);
    const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
    if (cvs.width !== w || cvs.height !== h) {
      cvs.width = w; cvs.height = h;
      gl.viewport(0, 0, w, h);
      needDraw = true;
    }
  }
  addEventListener('resize', resize);
  resize();

  let lastPaint = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused && !needDraw) return;
    if (now - lastPaint < 33) return;
    lastPaint = now;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) tAcc += dt;
    resize();

    gl.uniform2f(U.uRes, cvs.width, cvs.height);
    gl.uniform1f(U.uTime, tAcc);
    gl.uniform1f(U.uPitch, S.pitch);
    gl.uniform1f(U.uFront, S.front / 100);
    gl.uniform1f(U.uDecay, S.decay / 100);
    gl.uniform1f(U.uRefr, S.refr / 100);
    gl.uniform1f(U.uNorm, S.norm / 100);
    gl.uniform1f(U.uShine, S.shine);
    gl.uniform1f(U.uSpecPow, S.spec / 100);
    gl.uniform1f(U.uTrans, S.trans / 100);
    gl.uniform1f(U.uCaustic, S.caus / 100);
    gl.uniform1f(U.uTint, 0.55);
    gl.uniform1f(U.uBg, S.bg);
    gl.uniform1f(U.uWave, S.wave);
    gl.uniform4fv(U.uRipples, ripples);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    needDraw = false;
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

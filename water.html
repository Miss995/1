<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a1520">
<title>水面 · 摸一下</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; background:#0a1520; overflow:hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none; }
  #c { display:block; width:100vw; height:100vh; }

  #panel {
    position:fixed; left:12px; right:12px; bottom:12px;
    background: rgba(12,22,32,.72);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border:1px solid rgba(160,210,255,.16);
    border-radius:18px;
    color:#cfe4f5; font-size:12px;
    padding:10px 14px 12px;
    max-height:46vh; overflow-y:auto;
    transition: transform .25s ease, opacity .25s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  #panel.hide { transform: translateY(120%); opacity:0; pointer-events:none; }

  .hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .hd b { font-size:13px; letter-spacing:.06em; color:#e6f2ff; font-weight:600; }
  .hd span { opacity:.55; font-size:11px; }

  .row { display:flex; align-items:center; gap:10px; margin:7px 0; }
  .row label { flex:0 0 62px; opacity:.72; font-size:11.5px; }
  .row input[type=range] { flex:1; -webkit-appearance:none; height:22px; background:transparent; }
  .row input[type=range]::-webkit-slider-runnable-track {
    height:3px; border-radius:2px;
    background: linear-gradient(90deg, rgba(120,190,255,.75), rgba(120,190,255,.18));
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:15px; height:15px; margin-top:-6px;
    border-radius:50%; background:#bfe1ff;
    box-shadow:0 0 10px rgba(140,200,255,.75), 0 1px 3px rgba(0,0,0,.5);
  }
  .row .val { flex:0 0 34px; text-align:right; font-variant-numeric: tabular-nums; opacity:.85; font-size:11px; }

  .btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button {
    flex:1 1 auto; min-width:70px;
    background: rgba(120,190,255,.10);
    border:1px solid rgba(140,200,255,.24);
    color:#cfe4f5; border-radius:11px; padding:8px 10px;
    font-size:11.5px; font-family:inherit; cursor:pointer;
  }
  button:active { background: rgba(120,190,255,.26); }
  button.on { background: rgba(120,190,255,.30); border-color: rgba(160,215,255,.55); color:#fff; }

  #tip {
    position:fixed; top:16px; left:0; right:0; text-align:center;
    color:rgba(210,232,250,.55); font-size:12px; letter-spacing:.2em;
    pointer-events:none; transition:opacity .8s;
  }
  #toggle {
    position:fixed; top:12px; right:12px; z-index:5;
    width:36px; height:36px; border-radius:50%;
    background: rgba(12,22,32,.6); border:1px solid rgba(160,210,255,.2);
    color:#cfe4f5; font-size:15px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip">按 一 下 水 面</div>
<div id="toggle">≡</div>

<div id="panel">
  <div class="hd"><b>水面参数</b><span>摸一下试试</span></div>

  <div class="row"><label>波纹强度</label><input id="s_amp"   type="range" min="0" max="100" value="46"><span class="val" id="v_amp">46</span></div>
  <div class="row"><label>波纹密度</label><input id="s_scale" type="range" min="10" max="100" value="42"><span class="val" id="v_scale">42</span></div>
  <div class="row"><label>流速</label>    <input id="s_speed" type="range" min="0" max="100" value="28"><span class="val" id="v_speed">28</span></div>
  <div class="row"><label>折射</label>    <input id="s_refr"  type="range" min="0" max="100" value="50"><span class="val" id="v_refr">50</span></div>
  <div class="row"><label>波光</label>    <input id="s_spec"  type="range" min="0" max="100" value="62"><span class="val" id="v_spec">62</span></div>
  <div class="row"><label>水色</label>    <input id="s_tint"  type="range" min="0" max="100" value="55"><span class="val" id="v_tint">55</span></div>
  <div class="row"><label>手感</label>    <input id="s_rip"   type="range" min="0" max="100" value="65"><span class="val" id="v_rip">65</span></div>

  <div class="btns">
    <button data-bg="grid" class="on">格子底</button>
    <button data-bg="dots">圆点底</button>
    <button data-bg="stripes">彩条底</button>
  </div>
  <div class="btns">
    <button id="b_caustics" class="on">水下光斑</button>
    <button id="b_pause">继续</button>
  </div>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform float uAmp;
uniform float uScale;
uniform float uSpeed;
uniform float uRefr;
uniform float uSpec;
uniform float uTint;
uniform float uBg;
uniform float uCaustics;
uniform float uRip;

// 6 个涟漪：xy = 位置(uv 0..1)，z = 起手时间，w = 强度
uniform vec4 uRipples[6];

// ---------- 噪声 ----------
float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.52;
    mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
    for (int i = 0; i < 3; i++) {
        v += a * vnoise(p);
        p = rot * p * 2.07;
        a *= 0.5;
    }
    return v;
}

// ---------- 水底 ----------
vec3 underGrid(vec2 uv) {
    vec3 col = mix(vec3(0.048,0.095,0.140), vec3(0.125,0.205,0.275), uv.y);
    vec2 g = abs(fract(uv * vec2(9.0, 15.0)) - 0.5);
    float line = smoothstep(0.455, 0.500, max(g.x, g.y));
    col += line * vec3(0.30, 0.43, 0.53) * 0.55;
    float r = smoothstep(0.10, 0.0, length(uv - vec2(0.24, 0.68)));
    col += r * vec3(0.55, 0.66, 0.72) * 0.45;
    float r2 = smoothstep(0.16, 0.0, length(uv - vec2(0.78, 0.28)));
    col += r2 * vec3(0.42, 0.36, 0.30) * 0.50;
    return col;
}

vec3 underDots(vec2 uv) {
    vec3 col = mix(vec3(0.068,0.088,0.125), vec3(0.145,0.185,0.245), uv.y);
    vec2 cell = fract(uv * vec2(11.0, 17.0)) - 0.5;
    float d = smoothstep(0.21, 0.13, length(cell));
    float hue = fract(uv.x * 0.9 + uv.y * 0.55);
    vec3 dotc = mix(vec3(0.62,0.74,0.86), vec3(0.55,0.60,0.82), hue);
    col += d * dotc * 0.58;
    return col;
}

vec3 underStripes(vec2 uv) {
    float s = sin(uv.x * 14.0 + uv.y * 3.0);
    vec3 a = vec3(0.28,0.40,0.54);
    vec3 b = vec3(0.50,0.42,0.60);
    vec3 col = mix(a, b, s * 0.5 + 0.5) * mix(0.50, 1.0, uv.y);
    vec2 g = abs(fract(uv * vec2(6.0, 10.0)) - 0.5);
    float line = smoothstep(0.47, 0.50, max(g.x, g.y));
    col += line * vec3(0.72, 0.80, 0.90) * 0.30;
    return col;
}

vec3 under(vec2 uv) {
    if (uBg < 0.5)      return underGrid(uv);
    else if (uBg < 1.5) return underDots(uv);
    else                return underStripes(uv);
}

// ---------- 高度场（p 空间，单位一致） ----------
float waterHeight(vec2 p, float t) {
    float h = 0.0;
    h += fbm(p * 0.55 + vec2( t * 0.10, t * 0.06)) * 1.00;
    h += fbm(p * 1.50 - vec2( t * 0.18,-t * 0.12)) * 0.48;
    return h;
}

// ---------- 手指按下的涟漪（uv 空间） ----------
float rippleH(vec2 uv, float t) {
    float h = 0.0;
    float aspect = uRes.x / uRes.y;
    for (int i = 0; i < 6; i++) {
        vec4 r = uRipples[i];
        if (r.w <= 0.001) continue;
        float age = t - r.z;
        if (age < 0.0 || age > 2.8) continue;

        vec2 d = uv - r.xy;
        d.x *= aspect;
        float dist = length(d);
        float front = age * 0.28;
        // ★ 单边包络：波前内侧 0.10 之外归零（力只往外推，后面早该平了）
        //   外侧用高斯收，只留波前那一圈在动
        float tail = smoothstep(front - 0.10, front, dist);
        float head = exp(-pow(max(dist - front, 0.0) * 12.0, 2.0));
        float ring = tail * head;
        float fall  = exp(-age * 1.10);
        // ★ 色散：水波长波跑得快、短波跑得慢
        //   → 近处留下短波（密），远处全是长波（疏）
        //   → 时间越久短波耗散，整体越疏
        //   对数相位：phase = k0*r0*ln(1+r/r0)，波数 k0/(1+r/r0) 随距离平滑递减
        float k0 = 380.0 * exp(-age * 0.90);   // 基准波数（密），随年龄衰减
        float r0 = 0.10 + age * 0.10;          // 色散长度，随年龄外扩
        float phase = k0 * r0 * log(1.0 + dist / r0);
        h += sin(phase) * ring * fall * r.w;
        // 按下去的那一下中心也鼓一下
        h += exp(-pow(dist * 26.0, 2.0)) * exp(-age * 6.0) * r.w * 1.6;
    }
    return h;
}

void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    float aspect = uRes.x / uRes.y;

    vec2 p = (uv - 0.5) * vec2(aspect, 1.0) * uScale;
    float t = uTime * uSpeed;

    // 大浪 + 细纹的梯度
    float e = 0.006;
    float h0 = waterHeight(p, t);
    float hx = waterHeight(p + vec2(e, 0.0), t);
    float hy = waterHeight(p + vec2(0.0, e), t);
    vec2 grad = vec2(hx - h0, hy - h0) / e;

    // 涟漪的梯度（uv 空间）
    float re = 0.0008;
    float r0 = rippleH(uv, uTime);
    float rx = rippleH(uv + vec2(re, 0.0), uTime);
    float ry = rippleH(uv + vec2(0.0, re), uTime);
    vec2 rgrad = vec2(rx - r0, ry - r0) / re;

    float amp = uAmp * 0.0032;
    vec2 off = grad * amp * uRefr * 0.32 + rgrad * uRip * 0.00004;

    // 三通道色散
    vec3 colR = under(uv + off * 1.005);
    vec3 colG = under(uv + off);
    vec3 colB = under(uv + off * 0.995);
    vec3 col = vec3(colR.r, colG.g, colB.b);

    // 水色：越"深"越蓝，随大浪有起伏
    float depthCue = 0.45 + 0.30 * h0;
    vec3 waterCol = vec3(0.055, 0.235, 0.330);
    col = mix(col, col * waterCol * 3.0, uTint * 0.34 * depthCue);

    // ---------- 体积感靠亮面 ----------
    // 波峰朝向天的那一面泛亮，波谷不压黑 —— 暗只会让它看着像洞
    float crest = pow(max(h0 - 0.62, 0.0), 1.7) * 0.42 + pow(max(r0, 0.0), 2.4) * uRip * 0.26;
    col += crest * vec3(0.42, 0.62, 0.86) * 0.55;

    // ---------- 法线 ----------
    // 平滑法线：大浪 + 涟漪。涟漪降权，不让它主导
    //   否则同心圆的法线方向恒为径向，每一圈都会各自亮一道弧
    vec3 nWave = normalize(vec3(-(grad * 0.45 + rgrad * uRip * 0.0011), 1.0));

    // 碎光：高频小面朝各个方向，锐高光只有正好对准时才亮
    //   这才是"碎"的来源，而不是每个波纹自带一条亮带
    vec2 jit = vec2(
        sin(p.x * 31.0 + t * 2.30) * sin(p.y * 23.0 - t * 1.70),
        cos(p.x * 27.0 - t * 2.10) * cos(p.y * 29.0 + t * 2.70)
    );
    vec3 nAll = normalize(vec3(-(grad * 0.45 + rgrad * uRip * 0.0011 + jit * 0.85), 1.0));

    // 主高光（锐）—— 只用碎的那层
    vec3 L = normalize(vec3(0.42, 0.80, 0.50));
    float spec = pow(max(dot(nAll, L), 0.0), 90.0);
    col += spec * uSpec * vec3(1.0, 0.99, 0.96) * 2.6;

    // 宽高光（柔）—— 只用平滑那层，不跟着碎点糊
    float spec2 = pow(max(dot(nWave, L), 0.0), 14.0);
    col += spec2 * uSpec * vec3(0.45, 0.66, 0.86) * 0.55;

    // 水下焦散
    if (uCaustics > 0.5) {
        float c1 = sin(grad.x * 7.0 + t * 1.3);
        float c2 = sin(grad.y * 7.0 - t * 1.0);
        float caustic = pow(abs(c1 * c2), 5.0);
        col += caustic * vec3(0.38, 0.66, 0.76) * 0.80;
    }

    // ---------- 远近：近处透（看得见底），远处亮（照出天） ----------
    float fres = smoothstep(0.05, 0.80, length((uv - 0.5) * vec2(aspect, 1.0)));
    vec3 skyCol = vec3(0.24, 0.42, 0.62) * mix(0.62, 1.20, uv.y);
    col = mix(col, skyCol, fres * 0.20 * uTint);

    // 暗角
    vec2 vg = uv - 0.5;
    float vig = smoothstep(0.90, 0.18, length(vg * vec2(1.0, 0.92)));
    col *= mix(0.50, 1.0, vig);

    // 色调映射
    col = col / (col + vec3(0.82));
    col = pow(col, vec3(0.90));

    gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function(){
  const cvs = document.getElementById('c');
  const gl = cvs.getContext('webgl', { antialias:false, alpha:false, powerPreference:'high-performance' })
          || cvs.getContext('experimental-webgl');
  if (!gl) {
    document.body.innerHTML = '<div style="color:#cfe4f5;padding:40px;font-size:14px">这台设备不给 WebGL，看不成了。</div>';
    return;
  }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('SHADER ERR:', gl.getShaderInfoLog(s));
    }
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,   document.getElementById('vs').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('LINK ERR:', gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['uRes','uTime','uAmp','uScale','uSpeed','uRefr','uSpec','uTint','uBg','uCaustics','uRip']
    .forEach(n => U[n] = gl.getUniformLocation(prog, n));
  U.uRipples = gl.getUniformLocation(prog, 'uRipples');

  const S = { amp:46, scale:42, speed:28, refr:50, spec:62, tint:55, rip:65, bg:0, caustics:1 };
  let paused = true, tAcc = 2.0, last = performance.now();
  let needDraw = true;   // 暂停时只在需要时画一帧，其余时间一帧都不算

  // ---------- 涟漪（6 个槽，轮着用） ----------
  const RIP_N = 6;
  const ripples = new Float32Array(RIP_N * 4); // xy pos, z start, w strength
  let ripIdx = 0, lastRipTime = 0;

  function addRipple(u, v, strength) {
    const now = tAcc;
    if (now - lastRipTime < 0.055) return;   // 节流
    lastRipTime = now;
    const i = ripIdx % RIP_N;
    ripIdx++;
    ripples[i*4+0] = u;
    ripples[i*4+1] = v;
    ripples[i*4+2] = now;
    ripples[i*4+3] = strength;
  }

  function uvFromEvent(e) {
    const r = cvs.getBoundingClientRect();
    return [ (e.clientX - r.left) / r.width, 1.0 - (e.clientY - r.top) / r.height ];
  }

  let down = false;
  cvs.addEventListener('pointerdown', e => {
    down = true;
    if (paused) {
      paused = false; needDraw = true;
      const _bp = document.getElementById('b_pause');
      _bp.textContent = '暂停'; _bp.classList.remove('on');
    }
    const [u,v] = uvFromEvent(e);
    addRipple(u, v, 1.0);
    lastRipTime = 0; // 第一下不节流
  });
  cvs.addEventListener('pointermove', e => {
    if (!down) return;
    const [u,v] = uvFromEvent(e);
    addRipple(u, v, 0.75);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t =>
    cvs.addEventListener(t, () => { down = false; })
  );

  // ---------- 滑杆 ----------
  function bind(id, key) {
    const el = document.getElementById('s_' + id);
    const out = document.getElementById('v_' + id);
    const upd = () => { S[key] = +el.value; out.textContent = el.value; needDraw = true; };
    el.addEventListener('input', upd);
    upd();
  }
  bind('amp','amp'); bind('scale','scale'); bind('speed','speed');
  bind('refr','refr'); bind('spec','spec'); bind('tint','tint'); bind('rip','rip');

  document.querySelectorAll('[data-bg]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      S.bg = { grid:0, dots:1, stripes:2 }[btn.dataset.bg];
      needDraw = true;
    });
  });

  const bc = document.getElementById('b_caustics');
  bc.addEventListener('click', () => {
    S.caustics = S.caustics > 0.5 ? 0 : 1;
    bc.classList.toggle('on', S.caustics > 0.5);
    needDraw = true;
  });

  const bp = document.getElementById('b_pause');
  bp.addEventListener('click', () => {
    paused = !paused;
    bp.textContent = paused ? '继续' : '暂停';
    bp.classList.toggle('on', paused);
    needDraw = true;
  });

  const panel = document.getElementById('panel');
  document.getElementById('toggle').addEventListener('click', () => panel.classList.toggle('hide'));
  const tip = document.getElementById('tip');
  setTimeout(() => { tip.style.opacity = '0'; }, 3200);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1);
    const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
    if (cvs.width !== w || cvs.height !== h) {
      cvs.width = w; cvs.height = h;
      gl.viewport(0, 0, w, h);
      needDraw = true;
    }
  }
  addEventListener('resize', resize);
  resize();

  let lastPaint = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused && !needDraw) return;    // 暂停且已经画过 -> 不再消耗 GPU
    if (now - lastPaint < 33) return;
    lastPaint = now;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) tAcc += dt;
    resize();

    gl.uniform2f(U.uRes, cvs.width, cvs.height);
    gl.uniform1f(U.uTime, tAcc);
    gl.uniform1f(U.uAmp, S.amp / 50);
    gl.uniform1f(U.uScale, 0.9 + S.scale / 26);
    gl.uniform1f(U.uSpeed, S.speed / 42);
    gl.uniform1f(U.uRefr, S.refr / 42);
    gl.uniform1f(U.uSpec, S.spec / 60);
    gl.uniform1f(U.uTint, S.tint / 55);
    gl.uniform1f(U.uRip, S.rip / 65);
    gl.uniform1f(U.uBg, S.bg);
    gl.uniform1f(U.uCaustics, S.caustics);
    gl.uniform4fv(U.uRipples, ripples);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    needDraw = false;
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

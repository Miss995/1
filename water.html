<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;

<script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform float uPitch;
uniform float uFront;
uniform float uPhaseSpd;
uniform float uDecay;
uniform float uRefr;
uniform float uNorm;
uniform float uShine;
uniform float uSpecPow;
uniform float uTrans;
uniform float uSurfShade;
uniform float uCaustic;
uniform float uTint;
uniform float uBg;
uniform float uWave;
uniform float uSlice;
uniform float uDbgGrid;
uniform float uDbgWave;
uniform float uGerstner;
uniform float uBright;
uniform float uBaseGlow;

uniform vec4 uRipples[14];
uniform float uRipR[14];

float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.52;
    mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
    for (int i = 0; i < 3; i++) {
        v += a * vnoise(p);
        p = rot * p * 2.07;
        a *= 0.5;
    }
    return v;
}

// 水下光斑：光在水底汇聚出的网，不是斑块
// Worley / 细胞噪声：每格撒一个点，取"到最近点与第二近点的距离差"。
// 差值最小的地方 = 两个细胞的交界 —— 那是一条硬边折线。
// 真实 caustic 的骨架就是这样一群多边形拼起来，不是平滑曲线。
vec2 hash22(vec2 p) {
    p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
    return fract(sin(p) * 43758.5453);
}
float cellEdge(vec2 p) {
    vec2 n = floor(p);
    vec2 f = fract(p);
    float d1 = 8.0, d2 = 8.0;
    for (int j = -1; j <= 1; j++) {
        for (int i = -1; i <= 1; i++) {
            vec2 g = vec2(float(i), float(j));
            vec2 o = hash22(n + g);
            vec2 r = g + o - f;
            float d = dot(r, r);
            if (d < d1) { d2 = d1; d1 = d; }
            else if (d < d2) { d2 = d; }
        }
    }
    return sqrt(d2) - sqrt(d1);
}

float causticNet(vec2 p, float t) {
    float a = vnoise(p + vec2(t * 0.055, 0.0));
    float b = vnoise(p + vec2(0.0, t * 0.042) + 17.3);
    float edge = 1.0 - abs(a + b - 1.0);
    return pow(max(edge, 0.0), 10.0);
}

// ---------- 水底 ----------
vec3 underGrid(vec2 uv) {
    vec3 col = mix(vec3(0.055,0.115,0.170), vec3(0.150,0.245,0.320), uv.y);
    vec2 g = abs(fract(uv * vec2(9.0, 15.0)) - 0.5);
    float line = smoothstep(0.425, 0.500, max(g.x, g.y));
    col += line * vec3(0.42, 0.58, 0.70) * 0.62;
    if (uBaseGlow > 0.5) {
        float r = smoothstep(0.10, 0.0, length(uv - vec2(0.24, 0.68)));
        col += r * vec3(0.62, 0.74, 0.82) * 0.50;
        float r2 = smoothstep(0.16, 0.0, length(uv - vec2(0.78, 0.28)));
        col += r2 * vec3(0.48, 0.42, 0.36) * 0.55;
    }
    return col;
}

vec3 underDots(vec2 uv) {
    vec3 col = mix(vec3(0.080,0.105,0.150), vec3(0.170,0.215,0.285), uv.y);
    vec2 cell = fract(uv * vec2(11.0, 17.0)) - 0.5;
    float d = smoothstep(0.21, 0.13, length(cell));
    float hue = fract(uv.x * 0.9 + uv.y * 0.55);
    vec3 dotc = mix(vec3(0.72,0.84,0.96), vec3(0.65,0.70,0.92), hue);
    col += d * dotc * 0.62;
    return col;
}

vec3 underStripes(vec2 uv) {
    float s = sin(uv.x * 14.0 + uv.y * 3.0);
    vec3 a = vec3(0.34,0.48,0.62);
    vec3 b = vec3(0.58,0.50,0.68);
    vec3 col = mix(a, b, s * 0.5 + 0.5) * mix(0.55, 1.0, uv.y);
    vec2 g = abs(fract(uv * vec2(6.0, 10.0)) - 0.5);
    float line = smoothstep(0.47, 0.50, max(g.x, g.y));
    col += line * vec3(0.80, 0.88, 0.98) * 0.34;
    return col;
}

vec3 under(vec2 uv) {
    if (uBg < 0.5)      return underGrid(uv);
    else if (uBg < 1.5) return underDots(uv);
    else if (uBg < 2.5) return underStripes(uv);
    // 纯色底：水面越透它越明显，所以想"只看水面本身"就切这个。
    // 之前没有这一档，格子底那些发白的细直线（underGrid 里 col += line * 0.34）会被当成"水面的白"。
    else                return vec3(0.13, 0.26, 0.31);
}

// ---------- 大浪 ----------
// 波峰要尖，不能是圆弧。表面张力会把峰顶拉出棱 —— 有了棱，坡度才突变，
// 明暗才有硬边；sin 太光滑，切几档都还是渐变。
float waveSin(float x) {
    // 退回光滑 sin。abs(sin) 虽然导数有限，但零点处导数不连续 = 数学尖点，
    // 四波叠加后每个交叉点都是折痕，整片会变成折纸/钻石切面。
    return sin(x);
}

// 网格专用的高度场：只要三个方向接近的波。
// 水面渲染用的 waterHeight 是四个方向乱叠的 —— 那个用来做起伏好看，
// 但拿它切等值线就是一团乱麻（线会打结、绕小圈）。真实海面是风推着一个方向。
// 峰尖谷平：真实海浪不是 sin 那种上下对称的圆滑起伏。
// 正半轴压尖（pow<1 → 峰陡），负半轴拉平（pow>1 → 谷缓）。
// 这是 Gerstner 波"水平位移挤压波峰"效果的一个便宜近似。
float sharpSin(float ph) {
    float s = sin(ph);
    return s >= 0.0 ? pow(max(s, 1e-4), 0.72) : -pow(max(-s, 1e-4), 1.45);
}

float gridHeight(vec2 p, float t) {
    float h = 0.0;
    // 主波占绝对优势：四个波幅值接近时，一定会有点正负抵消 → 长出一个闭合的坑。
    // 真实海面是风推着一个方向，其余都是碎浪，抵不到 0。
    h += sharpSin(dot(p, vec2( 0.96,  0.28)) * 2.1 + t * 0.35) * 0.85;
    h += sharpSin(dot(p, vec2( 0.88,  0.47)) * 3.4 - t * 0.28) * 0.10;
    h += sharpSin(dot(p, vec2( 0.99, -0.14)) * 4.9 + t * 0.22) * 0.05;
    return h * 0.5 + 0.5;
}

// Worley 细胞噪声：把平面切成一块一块的多边形。
// 返回 (最近距离, 次近距离, 格子哈希)。
// d2-d1 小 = 靠近边界；格子哈希 = 这一块自己的身份。
vec3 worley3(vec2 p) {
    vec2 ip = floor(p);
    vec2 fp = fract(p);
    float d1 = 8.0, d2 = 8.0;
    vec2 cid = vec2(0.0);
    for (int y = -1; y <= 1; y++) {
        for (int x = -1; x <= 1; x++) {
            vec2 g = vec2(float(x), float(y));
            vec2 o = hash22(ip + g);
            vec2 r = g + o - fp;
            float d = dot(r, r);
            if (d < d1) { d2 = d1; d1 = d; cid = ip + g; }
            else if (d < d2) { d2 = d; }
        }
    }
    return vec3(sqrt(d1), sqrt(d2), hash21(cid));
}

float waterHeight(vec2 p, float t) {
    // 不用 fbm。fbm 的峰是孤立鼓包 —— 在鼓包上切等值线就是一个个闭合的环，
    // 明暗和高光也各自围着包心转，三样东西看起来各跑各的。
    // 真实水面是几条方向不同的波叠在一起：起伏是连续的条纹网络，
    // 等值线连成片、明暗顺着条纹、高光也顺着条纹，三样自然对齐。
    // 顺带：4 次 sin 比 fbm 那串噪声便宜得多。
    // 一个主波 + 两个碎浪，方向接近。
    // 之前是四个方向乱叠、幅值又接近（0.55/0.32/0.19/0.11）——
    // 一定有点会正负抵消，那里高度掉到 0、周围是高的，于是长出一个闭合的坑，
    // 看着就是"水流着流着突然凹进去一块"。
    // 真实海面是风推着一个方向，其余都是碎浪，抵不到 0。
    // ===== Gerstner =====
    // 正弦叠加的天花板是"平行直线"：频率是常数，等值线只能是等距平行线，怎么调都变不成水。
    // Gerstner 不靠叠加，靠【水平位移】：波峰附近的点被往波峰方向推，
    // 等值线自己就弯了。高度还是同一个 sin，没有相加抵消 → 不会出坑。
    //
    // 位移相位必须用【原位置 p】算（不是挪过的位置），否则会算成"位移自己推自己"。
    // Q = uGerstner ≤ 0.65 时 Q*A = 0.40 < 半个波长 0.37… 取 0.55 → 0.34，不到半个波长，不会翻过去。
    // ===== 六个频率的 Gerstner 叠加 —— 真实海面的"波浪谱"就是这么来的 =====
    // 上一版只有两个频率：两个固定频率交叉，等值线必然长成规整格子（像两块纱布叠着）。
    // 真实海面不规整，是因为频率本来就不是一个数：风推出来的浪有长有短，一层层叠着。
    //
    // 两条硬约束：
    //  ① 振幅加起来 0.90 < 1.0 —— 否则多波相加能抵到 0，那里就长出闭合的坑（老毛病）。
    //  ② 每个波自己的位移 Q*A 都小于它自己的半个波长 π/K —— 否则那个波自己踩到自己，翻过去。
    //     最紧的是 k=52 那个：位移 0.04u，半波长 π/52=0.060，够。
    //  方向各自错开 10~30°，交叉点才不会整齐排队。
    vec2 disp = vec2(0.0);
    disp += vec2( 0.96,  0.28) * (uGerstner * 0.35 * cos(dot(p, vec2( 0.96,  0.28)) * 8.5 + t * 0.85));
    disp += vec2( 0.82, -0.57) * (uGerstner * 0.22 * cos(dot(p, vec2( 0.82, -0.57)) * 13.0 + t * 1.15));
    disp += vec2( 0.34,  0.94) * (uGerstner * 0.14 * cos(dot(p, vec2( 0.34,  0.94)) * 19.5 + t * 1.45));
    disp += vec2( 0.71, -0.70) * (uGerstner * 0.09 * cos(dot(p, vec2( 0.71, -0.70)) * 27.0 + t * 1.75));
    disp += vec2(-0.60,  0.80) * (uGerstner * 0.06 * cos(dot(p, vec2(-0.60,  0.80)) * 38.0 + t * 2.05));
    disp += vec2( 0.93,  0.37) * (uGerstner * 0.04 * cos(dot(p, vec2( 0.93,  0.37)) * 52.0 + t * 2.35));

    vec2 pw = p + disp;

    float h = 0.0;
    h += waveSin(dot(pw, vec2( 0.96,  0.28)) * 8.5 + t * 0.85) * 0.35;
    h += waveSin(dot(pw, vec2( 0.82, -0.57)) * 13.0 + t * 1.15) * 0.22;
    h += waveSin(dot(pw, vec2( 0.34,  0.94)) * 19.5 + t * 1.45) * 0.14;
    h += waveSin(dot(pw, vec2( 0.71, -0.70)) * 27.0 + t * 1.75) * 0.09;
    h += waveSin(dot(pw, vec2(-0.60,  0.80)) * 38.0 + t * 2.05) * 0.06;
    h += waveSin(dot(pw, vec2( 0.93,  0.37)) * 52.0 + t * 2.35) * 0.04;
    return clamp(h * 0.5 + 0.5, 0.0, 1.0);
}

// waterHeight 的解析梯度：h = Σ A·sin(k·D·p + ωt)，∇h = Σ A·k·D·cos(...)。
// 比数值差分省三次 waterHeight 采样，而且跟高度场严格是同一套波。
vec2 waterGrad(vec2 p, float t) {
    vec2 g = vec2(0.0);
    float ph;
    // 跟 waterHeight 严格一致：先把点按六波位移挪过去，再在那里取六项梯度。
    vec2 disp2 = vec2(0.0);
    disp2 += vec2( 0.96,  0.28) * (uGerstner * 0.35 * cos(dot(p, vec2( 0.96,  0.28)) * 8.5 + t * 0.85));
    disp2 += vec2( 0.82, -0.57) * (uGerstner * 0.22 * cos(dot(p, vec2( 0.82, -0.57)) * 13.0 + t * 1.15));
    disp2 += vec2( 0.34,  0.94) * (uGerstner * 0.14 * cos(dot(p, vec2( 0.34,  0.94)) * 19.5 + t * 1.45));
    disp2 += vec2( 0.71, -0.70) * (uGerstner * 0.09 * cos(dot(p, vec2( 0.71, -0.70)) * 27.0 + t * 1.75));
    disp2 += vec2(-0.60,  0.80) * (uGerstner * 0.06 * cos(dot(p, vec2(-0.60,  0.80)) * 38.0 + t * 2.05));
    disp2 += vec2( 0.93,  0.37) * (uGerstner * 0.04 * cos(dot(p, vec2( 0.93,  0.37)) * 52.0 + t * 2.35));
    vec2 pw2 = p + disp2;

    g += vec2( 0.96,  0.28) * (8.5 * cos(dot(pw2, vec2( 0.96,  0.28)) * 8.5 + t * 0.85) * 0.35);
    g += vec2( 0.82, -0.57) * (13.0 * cos(dot(pw2, vec2( 0.82, -0.57)) * 13.0 + t * 1.15) * 0.22);
    g += vec2( 0.34,  0.94) * (19.5 * cos(dot(pw2, vec2( 0.34,  0.94)) * 19.5 + t * 1.45) * 0.14);
    g += vec2( 0.71, -0.70) * (27.0 * cos(dot(pw2, vec2( 0.71, -0.70)) * 27.0 + t * 1.75) * 0.09);
    g += vec2(-0.60,  0.80) * (38.0 * cos(dot(pw2, vec2(-0.60,  0.80)) * 38.0 + t * 2.05) * 0.06);
    g += vec2( 0.93,  0.37) * (52.0 * cos(dot(pw2, vec2( 0.93,  0.37)) * 52.0 + t * 2.35) * 0.04);
    return g * 0.5;   // 跟 waterHeight 里那个 *0.5 对齐
}

// ---------- 涟漪 ----------
float rippleH(vec2 uv, float t) {
    float h = 0.0;
    float aspect = uRes.x / uRes.y;
    for (int i = 0; i < 14; i++) {
        vec4 r = uRipples[i];
        if (r.w <= 0.001) continue;
        float age = t - r.z;
        if (age < 0.0 || age > 6.0) continue;

        vec2 d = uv - r.xy;
        d.x *= aspect;
        float dist = length(d);

        // 起手不是点，是一个跟手指差不多大的小环
        float front = uRipR[i] + age * uFront;
        float fall = exp(-age * uDecay) * (1.0 - smoothstep(5.0, 6.0, age));
        // 能量摊在越来越长的圆周上：1/sqrt(r)，不是指数硬砍
        float spread = 1.0 / sqrt(1.0 + dist * 1.8);
        // 主要衰减交给位置：跑到屏幕边缘才淡出去
        float edgeFade = 1.0 - smoothstep(0.34, 0.56, dist);   // 屏幕边缘之前就该淡完

        // 不用正弦波场了，直接画 5 个波峰：
        // 各自往外跑，从生到死就是这 5 个 —— 不增、不减、不冒新的
        float hAcc = 0.0;
        for (int n = 0; n < 5; n++) {
            // 五圈同一时刻出发，各自速度不同：靠外的快、靠内的慢。
            // 所以一开始挤在手指那儿，越往后越散开 —— 不增不减，没有"新生"
            // 短波跑得快、长波跑得慢 —— 所以靠外的快、靠内的慢。
            // （之前写反了：内圈跑得比外圈快，一路追上去把外圈撞散了）
            float speed = pow(1.16, float(n)) * uPhaseSpd * 0.5;
            float rn = uRipR[i] + float(n) * 0.009 + uFront * age * speed;
            float d = abs(dist - rn);
            // 外圈是毛细波：细而快；内圈是重力波：宽而慢
            // 宽度必须小于出生间距(0.009)，否则内圈几条挤在一起就是一坨糊。
            // 外圈因为是短波更细，内圈长波稍宽 —— 但两者都得比间距窄。
            float wv = (0.0052 + rn * 0.016) * (1.0 - float(n) * 0.08);
            float prof = exp(-pow(d / wv, 2.0));
            // 钟形：中间那两圈最清楚，最外和最里都淡下去 —— 真实的波包就长这样
            float ampN = 1.0 - abs(float(n) - 2.0) * 0.22;
            hAcc += prof * ampN;
        }
        // 中心平坦窗：手指底下那块是真的空的（振幅 0，不是"很弱"）
        float innerMask = smoothstep(0.0, uRipR[i] * 0.75, dist);
        h += hAcc * fall * spread * edgeFade * innerMask * r.w;

        // 手指压下去的那一下：中心是凹的。
        // 波不是"手指推出来的"，是水回填过冲出来的 —— 所以先有坑，坑很快填平。
        float dent = exp(-pow(dist / (uRipR[i] * 1.15), 2.0));
        h -= dent * 2.4 * exp(-age * 6.0) * r.w;

    }
    return h;
}

void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    float aspect = uRes.x / uRes.y;
    float t = uTime;
    vec2 p = (uv - 0.5) * vec2(aspect, 1.0);

    // 光源在画面外左上，往右下照
    vec3 L = normalize(vec3(-0.46, 0.58, 0.67));
    vec3 V = vec3(0.0, 0.0, 1.0);
    vec3 lightCol = vec3(1.0, 0.97, 0.90);

    // 大浪（默认关）
    vec2 gWave = vec2(0.0);
    float hWave = 0.5;
    if (uWave > 0.001) {
        float e = 0.006;
        vec2 pp = p * 2.5;
        float h0 = waterHeight(pp, t);
        float hx = waterHeight(pp + vec2(e, 0.0), t);
        float hy = waterHeight(pp + vec2(0.0, e), t);
        gWave = vec2(hx - h0, hy - h0) / e * uWave;   // 强度直接乘进来
        hWave = h0;
    }

    // 涟漪高度与梯度
    float re = 0.0006;
    float rH = rippleH(uv, uTime);
    float rx = rippleH(uv + vec2(re, 0.0), uTime);
    float ry = rippleH(uv + vec2(0.0, re), uTime);
    vec2 gRip = vec2(rx - rH, ry - rH) / re;

    // 折射位移
    vec2 off = gRip * uRefr * 0.00030 + gWave * 0.0028;
    vec2 uvw = uv + off;

    // ---- 水底（透亮的关键：底下被光照亮） ----
    vec3 col = under(uvw);
    // ★★ 光斑挪到【池底】（物理上本来就该在这儿）：
    //    以前加在 col 上，那时 col 已经是"池底+水色"的混合体，等于贴了一层纸，
    //    既不跟水面扭、也不跟池底走。现在直接加在 under() 出来的池底上。
    //    采样坐标用 uvw（已被折射扭过）→ 水面怎么晃，光斑就怎么扭。
    vec2 cp = (uvw - 0.5) * vec2(aspect, 1.0);
    // ★★ 光斑 = Worley 细胞边界（拿真实照片对过：水底光斑就是一堆闭合多边形拼的网）
    //    cellEdge 返回"到最近点与第二近点的距离差"，越靠边界越小。
    //    坐标被水面的波推着走 → 网跟着水扭，不是一张钉死的贴图。
    // ★★★ 光斑 = 高度场【自己的沟】。不另外画图案，让水的形状自己给出网。
    //     为什么不画 Worley：那张网再漂亮也跟这片水没关系，所以永远像贴图（v113-v115 就是）。
    //     为什么不切曲率：lap 会把高频放大，等值线碎成沙（v112）。
    //     h 本身是平滑的 —— 切它的等值线，低谷那几圈天然顺着沟走，形状跟水同源、动起来就跟着动。
    // ⚠️ 用 p（未折射），不能用 cp/uvw：那样等于把高度场先用折射扭一遍再切等高线，
    //    水扭一次、光斑再扭一次 = 扭两遍，线被扯得夸张（v116 就是）。
    //    光斑跟水面明暗必须落在同一个坐标系里，沟和线才对得上。
    float hc = waterHeight(p, t);
    float caustBand = abs(fract(hc * 7.0) - 0.5) * 2.0;   // 0 = 正好在一条等高线上
    float causLine  = 1.0 - smoothstep(0.0, 0.16, caustBand);  // 线宽
    float causAmp   = smoothstep(0.62, 0.30, hc);              // 只留低谷（沟），鼓包顶上不画
    float caustV = causLine * causAmp * uCaustic;
    col += caustV * vec3(0.92, 0.99, 1.0) * 1.0;

    // 水里的光斑：光穿过波峰被聚焦打在水底 —— 波峰处聚成细亮纹，平坦处几乎没有。
    // 频率要高（一屏几十条），强度要克制，而且必须跟波挂钩。
    // ---- 光斑：不是画在底下的网，是水面自己切出来的分界线 ----
    // 水被波峰切成一面面小镜子，两面镜子折光方向在那里交叉 → 那条交界线才亮。
    // 所以直接从"高度"切等值线：浪高每过一个高度就是一条交界，
    // 浪动线就动、浪有形线就有形 —— 它本来就在水里，不靠外部图案去凑。
    // 光斑不是独立的图案，是"最亮那部分波面"的锐化 —— 跟明暗同源。
    // 之前用高度等值线，而等值线在数学上垂直于梯度，所以永远跟明暗错开。
    // 光斑 = 明暗的分界线（光在那里对折），不是最亮的那一块。
    // 最亮处是平滑渐变；对折处才是一侧发白、一侧直接暗下去的跳变。
    float lit = clamp(-(gWave.x * L.x + gWave.y * L.y) * 1.8, 0.0, 1.0);
    float bandL = abs(fract(lit * 7.0) - 0.5) * 2.0;
    float caus = 1.0 - smoothstep(0.0, 0.12, bandL);
    // 涟漪自己也有（波峰处）
    // 涟漪不加光斑：它太小，加光斑只会糊成一团，把明暗的环搅浑
    // 光斑不掺第二种颜色：它只跟着明暗走，在最亮那一档叠白。
    // 之前是"掺青绿"+"乘亮度"两层叠在一起，亮面就成了几种颜色混出来的。

    // 水色：薄薄一层蓝，不能压死底下的东西
    vec3 waterCol = vec3(0.13, 0.36, 0.46);
    col = mix(col, col * waterCol * 2.2, uTint * 0.20);

    // ---- 水面法线 ----
    vec3 n = normalize(vec3(-(gRip * uNorm * 0.0040 + gWave * 0.30), 1.0));

    // ---- ① 高光：光源在水面的碎倒影 ----
    // 高光要碎成星点：靠两层高频扰动把法线打碎（频率低了会糊成一片）
    // 光源是固定的（左上那个 L）。碎光靠的是法线本身的细小起伏，
    // 不是拿随机噪声往各方向推 —— 那样会让整圈都亮，看着像"光到处乱照"。
    // 所以扰动幅度砍到 1/3，pow 提上去：只有真正对准 H 的地方才亮。
    // 高光长在真实法线上，不靠随机噪声撒点 —— 那样只会碎成渣。
    // 噪声只留极小一点（0.008），作用是让亮带边缘别死板，不是用来"打碎"。
    vec2 jit = vec2(vnoise(uv * 260.0 + vec2(rH * 30.0, t * 0.22)),
                    vnoise(uv * 260.0 + vec2(7.7, rH * 30.0 - t * 0.20))) - 0.5;
    vec3 nSpec = normalize(n + vec3(jit * 0.008, 0.0));
    vec3 Hv = normalize(L + V);
    float rawSpec = max(dot(nSpec, Hv), 0.0);
    float spec = pow(rawSpec, 55.0 + uShine * 1.4) * 1.9;
    spec = clamp(spec, 0.0, 1.0);
    col = mix(col, lightCol * 2.05, spec * clamp(uSpecPow, 0.0, 1.0) * 0.95);

    // ---- ② 透光：波峰薄的地方，光穿过去 ----
    float crestH = max(rH, 0.0) * 0.5 + 0.5;
    float trans = pow(max(dot(n, L), 0.0), 1.5) * smoothstep(-0.05, 0.95, crestH);
    // 泳池底那种青绿：水滤过光之后的颜色，用混的，不是盖白
    vec3 poolCol = vec3(0.30, 0.74, 0.72);
    col = mix(col, poolCol * (0.45 + col * 1.05), trans * uTrans * 0.55);

    // ---- ③ 波面明暗：每面小镜子反的东西不一样 ----
    // 不是阴影 —— 水面不挡光。坡面朝天那一侧反的是天（亮），
    // 背过去那一侧反的是对岸和水底（暗）。连续渐变，没有一条硬边。
    // 用梯度在光向(水平分量)上的投影算坡面朝向，量压在 ±12% 以内。
    // 涟漪：量压在小范围，别抢戏
    // 水面不投影。亮是反光增强，暗只是看到更深的水 ——
    // 量级要小，而且不对称：往上给得出，往下压不动太多。
    // 涟漪：小起伏，保持平滑。硬切会把它碎成渣（面片只给大浪）。
    float shadeRip  = clamp(-(gRip.x * L.x + gRip.y * L.y) * uSurfShade * 0.0015, -0.05, 0.06);
    // 大浪：每个波峰是一道折痕，水面被折成一块块小镜子，面片之间硬切
    // 面片 = 空间被波切开，不是"亮度分几档"。
    // 每个波从峰到谷，朝光的半边和背光的半边是两个面，中间一条线。
    // 关键是"二值"：同一个面里亮度一样，所以不会一路渐变。
    // 切面 = 把平面切成一块块（细胞噪声），不是按高度切等高线。
    // ---- 正交网格：等高线 × 梯度线 ----
    // 严格算梯度线是"积分曲线"，要沿梯度一步步走，太贵。
    // 近似：把高度场旋转 90°，它的等值线方向正好跟原来的梯度线重合。
    // 两组等值线相交 → 一块块多边形，而且整张网跟着波一起走
    // （这才是"水面"；Worley 是任意细胞，跟波没关系）。
    vec2 pp2 = p * 2.5;   // 细条纹 = 明暗层次多 = 好调体积感
    float h1 = waterHeight(pp2, t);
    float h2 = waterHeight(vec2(pp2.y, -pp2.x), t);
    float n1 = h1 * uSlice * 3.0;
    float n2 = h2 * uSlice * 3.0;
    float f1 = fract(n1), f2 = fract(n2);
    float d1 = min(f1, 1.0 - f1);          // 到最近一条等高线的距离
    // 临时关掉：旋转 90° 的波当梯度线，现在也是乱圈，跟等高线对不上，看着是麻。
    // 先只看一组线，确认等高线跟着地形走成什么样。
    float d2 = 1.0;                        // 1.0 = 永远不在线上 = 这组不画
    float border = smoothstep(0.0, 0.035, min(d1, d2));   // 0=在线上，1=格子里
    float cid = floor(n1) * 37.0 + floor(n2) * 91.0;     // 两条线的层级编号 = 格子 id
    // 每格的亮度 = 这一格的水面朝向光源的多少（不是随机数）
    // 法线取该点梯度 —— 格子是被等值线圈出来的，一圈之内朝向基本一致，所以看着是一块块纯色。
    // 法线用同一套波的解析梯度：不依赖「大浪」滑杆（那个默认是 0，gWave 一直是 0，
    // 所以之前法线竖直、每格亮度一样，看着就是平的）。
    vec2 gGrid = waterGrad(pp2, t);
    vec3 nGrid = normalize(vec3(-gGrid * 0.05, 1.0));         // 0.12 太陡(法线斜到50°)，梯度跳动剧烈；0.05 平缓些
    float litGrid = dot(nGrid, L);
    // 迎光 / 背光：看 litGrid 相对平静水面（L.z=0.67）的偏移。
    // 关键是符号 —— 波峰的左坡和右坡法线方向相反，不是"大小不同"。
    // 之前量化 6 档全落在一档里，所以整个波峰都成了迎光面。
    // 判据换掉：不是拿"亮度值"当明暗（那个是连续渐变的，暗面会挤在坡面中线一条），
    // 而是拿"坡朝哪边"—— 沿主波方向看梯度的符号，符号一变整个坡面就翻。
    float slopeMag = length(gGrid);
    float slopeDir = slopeMag > 1e-4 ? dot(gGrid / slopeMag, vec2(0.96, 0.28)) : 0.0;
    float facing = smoothstep(-0.12, 0.12, -slopeDir);   // 窄过渡，不留就成折纸
    // 迎光面反射天空 → 偏白；背光面透出水下 → 偏青。两个颜色，不是同一个颜色加亮加暗。
    // 迎光那个颜色现在接滑杆：0 = 灰蓝（等于没有亮面），1 = 原来的近白。
    float mixT = facing;
    // 下限必须就是背光色本身：否则滑杆拖到 0 时迎光面还是"灰蓝"，比背光的青亮，
    // 于是在青底上浮出一片片灰白的斑 —— 那不是水，是"亮面没关干净"。
    // 现在 0 = 迎光色 == 背光色 → 两个面同色 → 明暗物理上消失。
    vec3 brightC   = mix(vec3(0.20, 0.44, 0.52), vec3(0.90, 0.96, 1.00), uBright);
    vec3 shadeTint = mix(vec3(0.20, 0.44, 0.52), brightC, mixT);
    float shadeWave = 0.0;

    // ---- 原始波模式：纯灰度画高度场，不带网格、不带明暗、不带任何效果 ----
    // 用来直接看"这个波长什么样"，而不是看它被网格切成什么样。
    if (uDbgWave > 0.5) {
        float hh = waterHeight(p * 2.5, t);
        gl_FragColor = vec4(vec3(hh), 1.0);
        return;
    }

    // ---- 网格调试模式：只画网格本身，其他全关 ----
    if (uDbgGrid > 0.5) {
        // 纯白底 + 黑线：只看网格本身，不带任何明暗，否则灰度抢眼反而看不见线
        float lineLo = 1.0 - smoothstep(0.0, 0.030, min(d1, d2));
        vec3 dbg = mix(vec3(0.97), vec3(0.06), lineLo);
        gl_FragColor = vec4(dbg, 1.0);
        return;
    }

    // 光斑（焦散）：光穿过波峰之后聚焦在面与面的交界上 —— 那里光被对折得最厉害。
    // 真实的焦散是断续的亮点，不是一整条线，所以在边界上再挑一部分点。
    // 按空间坐标判，不按格子判：
    // 用 wc.z（最近格子哈希）的话，一整格的边界会同时亮或同时灭 → 看着有的有有的没有。
    // ---- 光斑（焦散）----
    // 以前画在【等高线】上（(1.0 - border)）——那等于"面与面的交界处发亮"。
    // 两条波时边界稀，看着还行；六个波交叉后边界密了好几倍，一拉滑杆就糊成一片白线。
    //
    // 换成按【波峰】找：真正的水面焦散是"光穿过波峰被聚焦"，亮的是峰顶，不是交界线。
    // 判据直接用 h1（高度，0..1）：越高越接近峰顶。
    // 好处是数量级稳定 —— 波再密，峰顶的量不会跟着边界一起翻倍。
    // caustMask 保留一点点断续，因为真实焦散是碎的、不是一整片。
    // 那颗 hash 遮罩整个去掉 —— 它就是之前画面上一格一格的像素方块。
    // 真实焦散的形状本来就由水面自己决定（谁把光折过来），不需要再随机挑点。
    // 门槛压低：六波相加时波峰"只是有点高"，很少冲到 0.84，
    // 原来的 smoothstep(0.58,0.84) 把绝大部分都掐掉了。
    // ⚠️ 名字不能用 caus —— 480 行已经有一个 float caus（波峰扫描线用的），
    // 同一个函数里重名 = 编译失败 = 整页黑。v100/v101 就是这个原因。
    // ★ 判断翻过来：光斑长在【沟里】（h1 低谷），不是峰顶。
    // 看原始波灰度图就明白：一块一块之间的黑缝，是相邻两个面折进去的地方，
    // 光在那里被折过来 —— 那才是焦散该出现的位置。
    // 之前挑 h1 高的地方，等于把光斑画在每一块的中间，方向整个反了。
    // ★ 光斑 = 【曲率】，不是方向。
    //
    // 前两版都从"梯度方向"找交界线（slopeDir / dirLow 过零），结果：
    //   高频波 → 碎成一截一截（一小点一小点）
    //   低频波 → 在涡旋处绕成一圈，长成螺旋（她说的"抽风"就是这个）
    // 根因：梯度方向是【方向量】，在二维场里绕一圈是正常的，它天生会卷。
    //
    // 物理真相：池底光斑是水面把阳光【聚焦】到池底 —— 聚焦发生在水面凹进去的地方，
    // 也就是高度场的二阶导（拉普拉斯）最负处。这个量天然是点状/网格状的，不会卷。
    //
    //   lap = (hR + hL + hU + hD - 4h) / dx²   ← 凹处为负，凸处为正
    //   取负值 → 凹处亮
    // ⚠️ 不能借用别处的 e —— 它定义在上一个代码块里，这里看不见（上一版全黑就是这个）。
    col *= (1.0 + shadeRip);
    col = mix(col, shadeTint, 0.16 * border);   // 边界密了，混色要收（原来 0.30）   // border=0 在线上不受影响



    // ---- ④ 极弱的整体环境反光（俯视只有百分之几，不该看得见） ----
    vec3 R = reflect(-V, n);
    float rim = pow(1.0 - max(dot(n, V), 0.0), 5.0);
    col += rim * smoothstep(-0.1, 0.9, R.y) * 0.12 * vec3(0.40, 0.62, 0.86);

    // ---- 暗角 ----
    vec2 vg = uv - 0.5;
    float vig = smoothstep(0.98, 0.24, length(vg * vec2(1.0, 0.92)));
    col *= mix(0.70, 1.0, vig);

    // ---- 色调映射（往亮里拉） ----
    col = col / (col + vec3(0.70));
    col = pow(col, vec3(0.84));

    gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function(){
  const cvs = document.getElementById('c');
  cvs.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
  const gl = cvs.getContext('webgl', { antialias:false, alpha:false, powerPreference:'high-performance' })
          || cvs.getContext('experimental-webgl');
  if (!gl) {
    document.body.innerHTML = '<div style="color:#cfe4f5;padding:40px;font-size:14px">这台设备不给 WebGL，看不成了。</div>';
    return;
  }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('SHADER ERR:', gl.getShaderInfoLog(s));
      document.title = 'SHADER ERR';
    }
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,   document.getElementById('vs').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('LINK ERR:', gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['uRes','uTime','uPitch','uFront','uDecay','uRefr','uNorm','uShine',
   'uSpecPow','uTrans','uCaustic','uTint','uBg','uWave','uBaseGlow','uSlice','uDbgGrid','uDbgWave','uGerstner','uBright']
    .forEach(n => U[n] = gl.getUniformLocation(prog, n));
  U.uRipples = gl.getUniformLocation(prog, 'uRipples');
  U.uPhaseSpd = gl.getUniformLocation(prog, 'uPhaseSpd');
  U.uRipR = gl.getUniformLocation(prog, 'uRipR');
  U.uSurfShade = gl.getUniformLocation(prog, 'uSurfShade');

  const S = { pitch:180, spd:200, front:28, decay:8, refr:40, norm:100,
              shine:80, spec:90, trans:55, caus:60, surf:100, bg:0, wave:0, glow:0, slice:200, dbgGrid:0, dbgWave:0, gerstner:55, bright:60 };
  let paused = true, tAcc = 2.0, last = performance.now();
  let needDraw = true;

  const RIP_N = 14;
  const ripples = new Float32Array(RIP_N * 4);
  const ripR = new Float32Array(RIP_N);
  let ripIdx = 0, lastRipTime = 0;

  function addRipple(u, v, strength) {
    const now = tAcc;
    if (now - lastRipTime < 0.018) return;
    lastRipTime = now;
    const i = ripIdx % RIP_N;
    ripIdx++;
    ripples[i*4+0] = u;
    ripples[i*4+1] = v;
    ripples[i*4+2] = now;
    ripples[i*4+3] = strength;
    ripR[i] = curStartR;
  }

  function uvFromEvent(e) {
    const r = cvs.getBoundingClientRect();
    return [ (e.clientX - r.left) / r.width, 1.0 - (e.clientY - r.top) / r.height ];
  }

  // 手指压在屏上的真实大小（uv 高度比例）。鼠标不报面积，退回一个手感值
  let curStartR = 0.036;
  function touchRadiusUV(e) {
    const r = cvs.getBoundingClientRect();
    let d = e.width;
    if (!d || d <= 1) d = r.height * 0.072;   // 鼠标/设备不报 → 约 3.6% 屏高
    return Math.max(0.012, Math.min(0.11, (d * 0.5) / r.height));
  }

  let down = false;
  let holdU = 0, holdV = 0, holdNext = 0;

  cvs.addEventListener('pointerdown', e => {
    e.preventDefault();
    down = true;
    if (paused) {
      paused = false; needDraw = true;
      const _bp = document.getElementById('b_pause');
      _bp.textContent = '暂停'; _bp.classList.remove('on');
    }
    const [u,v] = uvFromEvent(e);
    curStartR = touchRadiusUV(e);
    holdU = u; holdV = v;
    addRipple(u, v, 1.0);
    lastRipTime = 0;
    prevU = u; prevV = v;
    holdNext = tAcc + 0.32;      // 按住不动也隔一会儿再冒一个
  });
  let prevU = -1, prevV = -1;
  cvs.addEventListener('pointermove', e => {
    if (!down) return;
    const [u,v] = uvFromEvent(e);
    curStartR = touchRadiusUV(e);
    holdU = u; holdV = v;
    // 上一帧到这个位置之间补点，手划快了也不会一个点一个点地跳
    if (prevU >= 0) {
      const dx = u - prevU, dy = v - prevV;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 0.014) return;          // 手指抖动，不新加涟漪
      const steps = Math.min(Math.floor(d / 0.0055), 14);
      for (let i = 1; i <= steps; i++) {
        const k = i / (steps + 1);
        // 越靠后（离当前手指越近）越强，尾巴渐弱
        addRipple(prevU + dx * k, prevV + dy * k, 0.14 + 0.18 * k);
      }
    }
    addRipple(u, v, 0.44);
    prevU = u; prevV = v;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t =>
    cvs.addEventListener(t, e => { down = false; e.preventDefault && e.preventDefault(); })
  );

  function bind(id, key) {
    const el = document.getElementById('s_' + id);
    const out = document.getElementById('v_' + id);
    const upd = () => { S[key] = +el.value; out.textContent = el.value; needDraw = true; };
    el.addEventListener('input', upd);
    upd();
  }
  bind('pitch','pitch'); bind('spd','spd'); bind('front','front'); bind('decay','decay');
  bind('refr','refr');   bind('norm','norm');   bind('shine','shine');
  bind('spec','spec');   bind('trans','trans'); bind('caus','caus');
  bind('surf','surf'); bind('wave','wave'); bind('slice','slice'); bind('gerstner','gerstner'); bind('bright','bright');
  document.querySelectorAll('[data-dbg]').forEach(btn => {
    btn.addEventListener('click', () => {
      const on = btn.classList.toggle('on');
      const key = btn.dataset.dbg;                       // grid / wave，通用，加新按钮不用改这
      S['dbg' + key.charAt(0).toUpperCase() + key.slice(1)] = on ? 1 : 0;
      needDraw = true;
    });
  });

  document.querySelectorAll('[data-bg]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      S.bg = { grid:0, dots:1, stripes:2, solid:3 }[btn.dataset.bg];
      needDraw = true;
    });
  });

  const bg2 = document.getElementById('b_glow');
  bg2.addEventListener('click', () => {
    S.glow = S.glow > 0.5 ? 0 : 1;
    bg2.textContent = S.glow > 0.5 ? '底光 开' : '底光 关';
    bg2.classList.toggle('on', S.glow > 0.5);
    needDraw = true;
  });

  const bp = document.getElementById('b_pause');
  bp.addEventListener('click', () => {
    paused = !paused;
    bp.textContent = paused ? '继续' : '暂停';
    bp.classList.toggle('on', paused);
    needDraw = true;
  });

  const panel = document.getElementById('panel');
  document.getElementById('toggle').addEventListener('click', () => panel.classList.toggle('hide'));
  const tip = document.getElementById('tip');
  setTimeout(() => { tip.style.opacity = '0'; }, 3200);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1);
    const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
    if (cvs.width !== w || cvs.height !== h) {
      cvs.width = w; cvs.height = h;
      gl.viewport(0, 0, w, h);
      needDraw = true;
    }
  }
  addEventListener('resize', resize);
  resize();

  let lastPaint = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused && !needDraw) return;
    if (now - lastPaint < 33) return;
    lastPaint = now;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) tAcc += dt;

    resize();

    gl.uniform2f(U.uRes, cvs.width, cvs.height);
    gl.uniform1f(U.uTime, tAcc);
    gl.uniform1f(U.uPitch, S.pitch);
    gl.uniform1f(U.uFront, S.front / 100);
    gl.uniform1f(U.uDecay, S.decay / 100);
    gl.uniform1f(U.uRefr, S.refr / 100);
    gl.uniform1f(U.uNorm, S.norm / 100);
    gl.uniform1f(U.uShine, S.shine);
    gl.uniform1f(U.uSpecPow, S.spec / 100);
    gl.uniform1f(U.uTrans, S.trans / 100);
    gl.uniform1f(U.uCaustic, S.caus / 100);
    gl.uniform1f(U.uSurfShade, S.surf / 100);
    gl.uniform1f(U.uTint, 0.55);
    gl.uniform1f(U.uBg, S.bg);
    gl.uniform1f(U.uWave, S.wave / 100);
    gl.uniform1f(U.uSlice, S.slice / 100);
    gl.uniform1f(U.uDbgGrid, S.dbgGrid);
    gl.uniform1f(U.uDbgWave, S.dbgWave);
    gl.uniform1f(U.uGerstner, S.gerstner / 100.0);
    gl.uniform1f(U.uBright, S.bright / 100.0);
    gl.uniform1f(U.uBaseGlow, S.glow);
    gl.uniform4fv(U.uRipples, ripples);
    gl.uniform1fv(U.uRipR, ripR);
    gl.uniform1f(U.uPhaseSpd, S.spd / 100);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    needDraw = false;
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

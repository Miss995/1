<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soul Gem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#08070d;overflow:hidden;
  font-family:-apple-system,"PingFang SC","Hiragino Sans",sans-serif;color:#cfc9e8}
#card{position:absolute;inset:12px;border-radius:6px;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 0%,rgba(120,100,190,.20),transparent 60%),
    linear-gradient(180deg,#141026,#0b0916 55%,#0a0813);
  box-shadow:0 0 0 1px rgba(160,140,230,.18),0 0 60px rgba(90,70,160,.25) inset}
#card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:3px 3px;mix-blend-mode:screen;opacity:.9}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
  padding:18px 20px 16px}
.top{text-align:center;letter-spacing:.42em;font-size:9px;color:#8b83b8;
  text-transform:uppercase}
.jp{text-align:center;font-size:26px;letter-spacing:.28em;margin-top:10px;
  color:#e9e3ff;font-weight:300;text-shadow:0 0 22px rgba(150,120,255,.45)}
.fr{text-align:center;font-size:9.5px;letter-spacing:.16em;color:#7d75a8;
  font-style:italic;margin-top:6px}
.rule{height:1px;margin:14px 0;background:linear-gradient(90deg,transparent,
  rgba(150,130,220,.45),transparent)}
.stats{display:flex;justify-content:space-between;text-align:center;font-size:8.5px;
  letter-spacing:.14em;color:#7c74a6}
.stats b{display:block;font-size:15px;letter-spacing:.06em;color:#ddd5ff;
  font-weight:400;margin-top:6px}
.spacer{flex:1}
.bottom{padding-top:10px}
.row{display:flex;justify-content:space-between;font-size:8.5px;
  letter-spacing:.14em;color:#7c74a6}
.row b{color:#cfc6f5;font-weight:400;letter-spacing:.06em}
input[type=range]{pointer-events:auto;width:100%;margin-top:12px;height:22px;
  -webkit-appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:1px;
  background:linear-gradient(90deg,rgba(190,170,255,.75),rgba(120,100,190,.18))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
  border-radius:50%;background:#e5dcff;margin-top:-5px;
  box-shadow:0 0 12px rgba(170,140,255,.9)}
#ver{position:absolute;top:9px;right:14px;font-size:9px;letter-spacing:.16em;color:#6d659a;z-index:9;pointer-events:none}
.hint{text-align:center;font-size:8px;letter-spacing:.2em;color:#5d5680;
  margin-top:8px}
</style>
</head>
<body>
<div id="card">
  <canvas id="c"></canvas>
  <div class="ui">
    <div id="ver">v8 · 18:21</div>
    <div class="top">Rapport d'Analyse · N°07</div>
    <div class="jp">ソウルジェム</div>
    <div class="fr">Soul Gem — l'âme du salon</div>
    <div class="rule"></div>
    <div class="stats">
      <div>透明度 · CLARTÉ<b id="cl">S11</b></div>
      <div>濁り · TURBIDITÉ<b id="tb">62%</b></div>
      <div>会話 · SALON<b id="sn">07</b></div>
    </div>
    <div class="spacer"></div>
    <div class="bottom">
      <div class="row"><span>内包物 · ce qu'elle contient</span><b id="st">des mots</b></div>
      <input id="r" type="range" min="0" max="100" value="62">
      <div class="hint">拖动 · 浊度</div>
    </div>
  </div>
</div>
<script>
const cv=document.getElementById('c'),gl=cv.getContext('webgl',{antialias:true,alpha:false});
if(!gl){document.body.innerHTML='<p style="padding:20px">这个浏览器不支持 WebGL</p>'}
const vs=`attribute vec3 aPos;attribute vec3 aNrm;
uniform mat4 uMVP;uniform mat3 uNM;
varying vec3 vN;varying vec3 vP;
void main(){vN=normalize(uNM*aNrm);vP=aPos;gl_Position=uMVP*vec4(aPos,1.0);}`;

const fs=`precision highp float;
uniform float uT;uniform float uTime;uniform vec2 uRes;uniform float uPass;
varying vec3 vN;varying vec3 vP;

float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float noise3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 float n=0.0;
 for(int x=0;x<2;x++)for(int y=0;y<2;y++)for(int z=0;z<2;z++){
   n+=mix(mix(mix(hash(i+vec3(x,y,z)),hash(i+vec3(1-x,y,z)),f.x),
              mix(hash(i+vec3(x,1-y,z)),hash(i+vec3(1-x,1-y,z)),f.x),f.y),
          mix(mix(hash(i+vec3(x,y,1-z)),hash(i+vec3(1-x,y,1-z)),f.x),
              mix(hash(i+vec3(x,1-y,1-z)),hash(i+vec3(1-x,1-y,1-z)),f.x),f.y),f.z);}
 return n/8.0;}

// 环境：上暗下亮的地平线 + 一个主光源
// 透过宝石看它，界线被扭曲 = 立刻有玻璃感
vec3 env(vec3 d){
  float h=d.y;
  vec3 sky=vec3(0.075,0.068,0.125);
  vec3 ground=vec3(0.30,0.26,0.42);
  vec3 c=mix(ground,sky,smoothstep(-0.55,0.65,h));
  vec3 Ld=normalize(vec3(-0.55,0.62,0.55));
  c+=vec3(1.0,0.95,1.0)*pow(max(dot(d,Ld),0.0),26.0)*2.4;
  c+=vec3(0.16,0.14,0.28)*pow(max(dot(d,normalize(vec3(0.65,-0.35,0.4))),0.0),7.0);
  // 细密的网格线：折射时会跟着弯，最能体现"透"
  float grid=abs(fract(d.x*6.0)-0.5)+abs(fract(d.y*6.0)-0.5);
  c+=vec3(0.11,0.11,0.18)*(1.0-smoothstep(0.0,0.075,grid));
  return c;
}

void main(){
  vec3 N=normalize(vN);
  bool back = uPass > 0.5;
  if(back) N = -N;                       // 背面：法线朝内看
  vec3 V=normalize(vec3(0.0,0.0,2.05)-vP);

  // Schlick Fresnel：只有边缘才强反射
  float ct=max(dot(N,V),0.0);
  float F=0.045+0.955*pow(1.0-ct,5.0);

  // 折射：进去一次，出来一次
  vec3 R1=refract(-V,N,1.0/1.55);
  vec3 R2=refract(R1,-N,1.55);
  if(dot(R2,R2)<0.001) R2=R1;          // 全反射兜底
  if(dot(R1,R1)<0.001) R1=-reflect(-V,N);

  vec3 trans=env(normalize(R2+vP*0.40))*vec3(0.86,0.84,1.0);   // 体色（淡紫）
  vec3 refl =env(reflect(-V,N));

  vec3 col=mix(trans,refl,F*0.85);

  // ---- 内部的亮（不跟着面走，这才是"透"）----
  float core=exp(-length(vP*vec3(1.30,0.95,1.30)-vec3(0.0,0.05,0.0))*4.6);
  col+=vec3(0.52,0.46,0.86)*core*0.62;
  // 底部聚焦（光从上面进来，在下面收成一团）
  float focus=exp(-length(vP-vec3(-0.02,-0.22,0.02))*10.0);
  col+=vec3(0.55,0.60,1.0)*focus*0.45;
  // 几粒内部碎光
  col+=vec3(0.92,0.90,1.0)*exp(-length(vP-vec3(-0.09,0.13,0.06))*24.0)*0.85;
  col+=vec3(0.70,0.78,1.0)*exp(-length(vP-vec3(0.11,-0.05,-0.03))*28.0)*0.55;
  col+=vec3(0.80,0.74,1.0)*exp(-length(vP-vec3(0.04,0.20,-0.08))*30.0)*0.45;

  // 边缘稍通透（真宝石四周比中心"薄"）
  col*=0.90+0.10*smoothstep(0.0,1.0,ct);

  // 内部一点点色散（别太花，KTV 感是从这来的）
  float dsp=sin(dot(R2,vec3(9.0,7.0,11.0))+uTime*0.4);
  col+=vec3(0.05,0.01,0.08)*dsp*0.35;

  // 锐高光
  vec3 Ld=normalize(vec3(-0.55,0.62,0.55));
  vec3 H=normalize(Ld+V);
  float sp=pow(max(dot(N,H),0.0),140.0);
  col+=vec3(1.0,0.99,1.0)*sp*1.4;

  // 极细的棱线提亮（面的边），让切面看得出
  float rimF=pow(1.0-ct,2.2);
  col+=vec3(0.42,0.46,0.72)*rimF*0.35;

  // 浑浊：内部絮状
  float nz=noise3(vP*5.0+vec3(0.0,uTime*0.04,0.0))*0.60
          +noise3(vP*13.0)*0.40;
  vec3 muddy=vec3(0.46,0.42,0.50);
  col=mix(col,muddy,uT*nz*0.85);
  col=mix(col,vec3(0.20,0.18,0.26),uT*0.22);

  // 背景（跟 env 的地平线对上，宝石才像浮在其中）
  vec3 bg=vec3(0.042,0.036,0.072);

  // 网点
  vec2 g=mod(gl_FragCoord.xy,3.0);
  col*=0.94+0.06*step(1.0,g.x)*step(1.0,g.y);
  col*=0.97+0.03*sin(gl_FragCoord.y*1.6);

  if(back){
    // 背面的面：压暗、去掉体色偏向，但要能被看见
    col *= 0.62;
    col += vec3(0.10,0.09,0.16);
    gl_FragColor=vec4(col,1.0);
  }else{
    // 正面的面：半透明，后面的面从这儿透上来
    float a=0.50+0.30*F;               // 边缘更实、中间更透
    gl_FragColor=vec4(col,a);
  }
}`

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
 if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(pr);gl.useProgram(pr);

// ---------- icosphere ----------
function icosphere(subdiv){
  const t=(1+Math.sqrt(5))/2;
  let v=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],
         [0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],
         [t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
  let f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
         [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
         [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
         [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  v=v.map(p=>{const l=Math.hypot(...p);return p.map(x=>x/l);});
  for(let s=0;s<subdiv;s++){
    const nf=[],cache={};
    const mid=(a,b)=>{
      const k=a<b?a+'_'+b:b+'_'+a;
      if(cache[k]!==undefined)return cache[k];
      const p=[(v[a][0]+v[b][0])/2,(v[a][1]+v[b][1])/2,(v[a][2]+v[b][2])/2];
      const l=Math.hypot(...p);
      v.push(p.map(x=>x/l));cache[k]=v.length-1;return cache[k];
    };
    for(const [a,b,c] of f){
      const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);
      nf.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]);
    }
    f=nf;
  }
  return {v,f};
}
const {v:IV,f:IF}=icosphere(1);   // 80 面（大块）

// 椭球 + 顶点扰动（不规则切割）
const rx=0.335, ry=0.405, rz=0.315;
function jitter(p){
  const s=Math.sin(p[0]*9.1+p[1]*7.3)*Math.cos(p[2]*8.7+p[0]*4.1);
  const k=1.0+s*0.035;
  return [p[0]*rx*k, p[1]*ry*k, p[2]*rz*k];
}
const VP=[];
for(const [a,b,c] of IF){
  const A=jitter(IV[a]),B=jitter(IV[b]),C=jitter(IV[c]);
  // flat normal
  const u=[B[0]-A[0],B[1]-A[1],B[2]-A[2]];
  const w=[C[0]-A[0],C[1]-A[1],C[2]-A[2]];
  let n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];
  const ln=Math.hypot(...n)||1; n=n.map(x=>x/ln);
  for(const P of [A,B,C]) VP.push(P[0],P[1],P[2],n[0],n[1],n[2]);
}
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(VP),gl.STATIC_DRAW);
const aPos=gl.getAttribLocation(pr,'aPos'),aNrm=gl.getAttribLocation(pr,'aNrm');
gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,24,0);
gl.enableVertexAttribArray(aNrm);gl.vertexAttribPointer(aNrm,3,gl.FLOAT,false,24,12);

const uMVP=gl.getUniformLocation(pr,'uMVP'),uNM=gl.getUniformLocation(pr,'uNM'),
      uT=gl.getUniformLocation(pr,'uT'),uTime=gl.getUniformLocation(pr,'uTime'),
      uRes=gl.getUniformLocation(pr,'uRes'),
      uPass=gl.getUniformLocation(pr,'uPass');

gl.enable(gl.DEPTH_TEST);

function mul(a,b){const o=new Float32Array(16);
 for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;
  for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o;}
function persp(fovy,asp,n,f){const t=1/Math.tan(fovy/2);const o=new Float32Array(16);
 o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
function rotY(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array(
 [c,0,-s,0, 0,1,0,0, s,0,c,0, 0,0,0,1]);}
function rotX(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array(
 [1,0,0,0, 0,c,s,0, 0,-s,c,0, 0,0,0,1]);}
function transZ(z){const o=new Float32Array(16);o[0]=o[5]=o[10]=o[15]=1;o[14]=z;return o;}
function nm3(m){return new Float32Array([m[0],m[4],m[8],m[1],m[5],m[9],m[2],m[6],m[10]]);}

let turb=0.62;
const r=document.getElementById('r'),tb=document.getElementById('tb'),cl=document.getElementById('cl');
r.addEventListener('input',()=>{turb=r.value/100;tb.textContent=r.value+'%';
  cl.textContent=turb<0.25?'S3':turb<0.5?'S7':turb<0.75?'S11':turb<0.9?'S15':'S19';});
function resize(){const d=Math.min(devicePixelRatio||1,2);
 cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();

const t0=performance.now();
function loop(now){
  const t=(now-t0)/1000;
  const asp=cv.width/cv.height;
  const proj=persp(0.62,asp,0.1,10);
  const view=transZ(-2.05);
  const model=mul(rotX(-0.14),rotY(t*0.22));
  const mv=mul(view,model);
  const mvp=mul(proj,mv);
  gl.uniformMatrix4fv(uMVP,false,mvp);
  gl.uniformMatrix3fv(uNM,false,nm3(mv));
  gl.uniform1f(uT,turb);
  gl.uniform1f(uTime,t);
  gl.uniform2f(uRes,cv.width,cv.height);
  gl.clearColor(0.042,0.036,0.072,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  const n=VP.length/6;
  // pass 1：背面（只画背面，写深度）
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.FRONT);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.uniform1f(uPass,1.0);
  gl.drawArrays(gl.TRIANGLES,0,n);

  // pass 2：正面（半透明混合，不写深度）
  gl.cullFace(gl.BACK);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.uniform1f(uPass,0.0);
  gl.drawArrays(gl.TRIANGLES,0,n);
  gl.depthMask(true);
  gl.disable(gl.BLEND);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soul Gem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#08070d;overflow:hidden;
  font-family:-apple-system,"PingFang SC","Hiragino Sans",sans-serif;color:#cfc9e8}
#card{position:absolute;inset:12px;border-radius:6px;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 0%,rgba(120,100,190,.20),transparent 60%),

  box-shadow:0 0 0 1px rgba(160,140,230,.18),0 0 60px rgba(90,70,160,.25) inset}
#card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:3px 3px;mix-blend-mode:screen;opacity:.9}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;

<body>
<div id="card">
  <canvas id="c"></canvas>
  <div class="ui">
    <div id="ver">v18 · 19:10</div>
    <div class="top">Rapport d'Analyse · N°07</div>
    <div class="jp">ソウルジェム</div>
    <div class="fr">Soul Gem — l'âme du salon</div>
    <div class="rule"></div>
    <div class="stats">
      <div>透明度 · CLARTÉ<b id="cl">S11</b></div>
      <div>濁り · TURBIDITÉ<b id="tb">62%</b></div>
      <div>会話 · SALON<b id="sn">07</b></div>
    </div>
    <div class="spacer"></div>
    <div class="bottom">
      <div class="row"><span>内包物 · ce qu'elle contient</span><b id="st">des mots</b></div>
      <input id="r" type="range" min="0" max="100" value="62">
      <div class="hint">拖动 · 浊度</div>
    </div>

</div>
<script>
const cv=document.getElementById('c'),gl=cv.getContext('webgl',{antialias:true,alpha:false});
if(!gl){document.body.innerHTML='<p style="padding:20px">这个浏览器不支持 WebGL</p>'}
const vs=`attribute vec3 aPos;attribute vec3 aNrm;attribute float aFace;
uniform mat4 uMVP;uniform mat3 uNM;
varying vec3 vN;varying vec3 vP;varying float vFace;
void main(){vN=normalize(uNM*aNrm);vP=aPos;vFace=aFace;gl_Position=uMVP*vec4(aPos,1.0);}`;

const fs=`precision highp float;
uniform float uT;uniform float uTime;uniform vec2 uRes;uniform float uPass;
uniform sampler2D uFaceTex;    // 80x1：R = 下一面索引 / 255
uniform sampler2D uNormTex;    // 80x1：RGB = 面法线（编码到 0..1）
varying vec3 vN;varying vec3 vP;varying float vFace;

const float FACE_N = 80.0;
int faceNext(int i){
  return int(texture2D(uFaceTex, vec2((float(i)+0.5)/FACE_N, 0.5)).r * 255.0 + 0.5);
}
vec3 faceNormalOf(int i){
  vec3 c = texture2D(uNormTex, vec2((float(i)+0.5)/FACE_N, 0.5)).rgb;
  return normalize(c * 2.0 - 1.0);
}

float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float noise3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 float n=0.0;
 for(int x=0;x<2;x++)for(int y=0;y<2;y++)for(int z=0;z<2;z++){
   n+=mix(mix(mix(hash(i+vec3(x,y,z)),hash(i+vec3(1-x,y,z)),f.x),
              mix(hash(i+vec3(x,1-y,z)),hash(i+vec3(1-x,1-y,z)),f.x),f.y),
          mix(mix(hash(i+vec3(x,y,1-z)),hash(i+vec3(1-x,y,1-z)),f.x),
              mix(hash(i+vec3(x,1-y,1-z)),hash(i+vec3(1-x,1-y,1-z)),f.x),f.y),f.z);}
 return n/8.0;}

// 环境：上暗下亮的地平线 + 一个主光源
// 透过宝石看它，界线被扭曲 = 立刻有玻璃感
vec3 env(vec3 d){
  float h=d.y;
  vec3 sky=vec3(0.38,0.31,0.56);
  vec3 ground=vec3(0.020,0.018,0.052);
  vec3 c=mix(ground,sky,smoothstep(-0.32,0.26,h));
  vec3 Ld=normalize(vec3(-0.55,0.62,0.55));
  c+=vec3(1.0,0.96,1.0)*pow(max(dot(d,Ld),0.0),22.0)*4.6;
  c+=vec3(0.14,0.09,0.27)*pow(max(dot(d,normalize(vec3(0.62,0.30,0.42))),0.0),6.0);
  float grid=abs(fract(d.x*7.0)-0.5)+abs(fract(d.y*7.0)-0.5);
  c+=vec3(0.055,0.045,0.110)*(1.0-smoothstep(0.0,0.06,grid));
  return c;
}

void main(){
  vec3 N=normalize(vN);
  bool back = uPass > 0.5;
  if(back) N = -N;                       // 背面：法线朝内看
  vec3 V=normalize(vec3(0.0,0.0,2.05)-vP);

  // Schlick Fresnel：只有边缘才强反射
  float ct=max(dot(N,V),0.0);
  float F=0.045+0.955*pow(1.0-ct,5.0);

  // 【真光路 · 2026-11-26】光进去之后不再"同一个面直接穿出"，
  // 而是查预计算好的表，在内部的面之间弹三跳——
  // 每一跳都有一点光从那面透出去（采环境），剩下的继续反射。
  vec3 dir = refract(-V, N, 1.0/1.55);
  if(dot(dir,dir)<0.001) dir = reflect(-V, N);   // 全反射兜底

  int cur = int(vFace + 0.5);
  vec3 innerLight = vec3(0.0);
  float decay = 1.0;
  for(int s = 0; s < 3; s++){
    int hit = faceNext(cur);
    vec3 Nh = faceNormalOf(hit);
    float facing = clamp(dot(Nh, -dir) * 2.0, 0.0, 1.0);   // 光正撞上去才亮
    // 这一面透出来的光（穿过它往外看）
    vec3 through = env(refract(dir, Nh, 1.55));
    innerLight += through * facing * decay;
    // 剩下的反射继续走
    dir = reflect(dir, Nh);
    decay *= 0.66;
    cur = hit;
  }
  vec3 trans = innerLight * vec3(0.74,0.60,1.05) + env(refract(dir, -N, 1.55)) * 0.25;
  vec3 refl = env(reflect(-V,N));

  vec3 col = mix(trans, refl, F*0.85);

  // ---- 内部的亮（不跟着面走，这才是"透"）----
  float core=exp(-length(vP*vec3(1.30,0.95,1.30)-vec3(0.0,0.05,0.0))*7.2);
  col+=vec3(0.56,0.50,0.95)*core*0.26;
  // 底部聚焦（光从上面进来，在下面收成一团）
  float focus=exp(-length(vP-vec3(-0.02,-0.22,0.02))*10.0);
  col+=vec3(0.58,0.64,1.0)*focus*0.40;
  // 几粒内部碎光
  col+=vec3(0.92,0.90,1.0)*exp(-length(vP-vec3(-0.09,0.13,0.06))*24.0)*0.85;
  col+=vec3(0.70,0.78,1.0)*exp(-length(vP-vec3(0.11,-0.05,-0.03))*28.0)*0.55;
  col+=vec3(0.80,0.74,1.0)*exp(-length(vP-vec3(0.04,0.20,-0.08))*30.0)*0.45;

  // ---- 表面受光：方向感全靠这一层 ----
  vec3 Ls=normalize(vec3(-0.45,0.72,0.52));
  float lam=max(dot(N,Ls),0.0);
  col*=0.55+0.50*lam;
  // 顶端一线被照亮
  col+=vec3(0.30,0.26,0.50)*pow(lam,4.0)*0.28;
  // 背光侧压暗，但要留住内部的亮
  col*=0.86+0.14*ct;

  // 内部一点点色散（别太花，KTV 感是从这来的）
  float dsp=sin(dot(dir,vec3(9.0,7.0,11.0))+uTime*0.4);
  col+=vec3(0.05,0.01,0.08)*dsp*0.35;

  // 锐高光
  vec3 Ld=normalize(vec3(-0.55,0.62,0.55));
  vec3 H=normalize(Ld+V);
  float sp=pow(max(dot(N,H),0.0),140.0);
  col+=vec3(1.0,0.99,1.0)*sp*2.4;

  // 极细的棱线提亮（面的边），让切面看得出
  float rimF=pow(1.0-ct,2.2);
  col+=vec3(0.42,0.46,0.72)*rimF*0.16;

  // 浑浊：内部絮状
  float nz=noise3(vP*5.0+vec3(0.0,uTime*0.04,0.0))*0.60
          +noise3(vP*13.0)*0.40;
  vec3 muddy=vec3(0.46,0.42,0.50);
  col=mix(col,muddy,uT*nz*0.85);
  col=mix(col,vec3(0.20,0.18,0.26),uT*0.22);

  // 背景（跟 env 的地平线对上，宝石才像浮在其中）
  vec3 bg=vec3(0.042,0.036,0.072);

  // 网点
  vec2 g=mod(gl_FragCoord.xy,3.0);
  col*=0.94+0.06*step(1.0,g.x)*step(1.0,g.y);
  col*=0.97+0.03*sin(gl_FragCoord.y*1.6);

  if(back){
    // ---- 背面的面：用「从中心往外」的内部光，做出强明暗 ----
    vec3 N0=normalize(vN);                  // 原始法线（朝外）
    float dIn=max(dot(N0,normalize(vP+vec3(0.0,0.0001,0.0))),0.0);  // 朝中心的亮
    float dIn2=max(dot(N0,normalize(vec3(-0.45,0.72,0.5))),0.0);    // 另一侧的辅助
    float lum=0.06 + 1.55*pow(dIn,1.6) + 0.42*dIn2;
    col=vec3(0.46,0.38,0.78)*lum;
    col+=vec3(0.05,0.04,0.09);
    // 靠近中心更亮（芯的内侧）
    float coreIn=exp(-length(vP)*3.4);
    col+=vec3(0.55,0.50,0.92)*coreIn*0.55;
    gl_FragColor=vec4(col,1.0);
  }else{
    // 正面的面：半透明，后面的面从这儿透上来
    float a=0.40+0.46*F;               // 边缘更实、中间更透
    gl_FragColor=vec4(col,a);
  }
}`

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
 if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){
   const msg = gl.getShaderInfoLog(o);
   console.error(msg);
   const d = document.createElement('pre');
   d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;background:#300;color:#f99;font-size:11px;padding:8px;z-index:999;white-space:pre-wrap;border-radius:6px';
   d.textContent='SHADER FAIL\n'+msg;
   document.body.appendChild(d);
 }return o;}
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(pr);gl.useProgram(pr);

// ---------- icosphere ----------
function icosphere(subdiv){
  const t=(1+Math.sqrt(5))/2;
  let v=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],
         [0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],
         [t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
  let f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
         [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
         [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
         [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  v=v.map(p=>{const l=Math.hypot(...p);return p.map(x=>x/l);});
  for(let s=0;s<subdiv;s++){
    const nf=[],cache={};
    const mid=(a,b)=>{
      const k=a<b?a+'_'+b:b+'_'+a;
      if(cache[k]!==undefined)return cache[k];
      const p=[(v[a][0]+v[b][0])/2,(v[a][1]+v[b][1])/2,(v[a][2]+v[b][2])/2];
      const l=Math.hypot(...p);
      v.push(p.map(x=>x/l));cache[k]=v.length-1;return cache[k];
    };
    for(const [a,b,c] of f){
      const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);
      nf.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]);
    }
    f=nf;
  }
  return {v,f};
}
const {v:IV,f:IF}=icosphere(1);   // 80 面（大块）

// 椭球 + 顶点扰动（不规则切割）
const rx=0.335, ry=0.405, rz=0.315;
function jitter(p){
  const s=Math.sin(p[0]*9.1+p[1]*7.3)*Math.cos(p[2]*8.7+p[0]*4.1);
  const k=1.0+s*0.035;
  return [p[0]*rx*k, p[1]*ry*k, p[2]*rz*k];
}
const VP=[];
let fi=0;
for(const [a,b,c] of IF){
  const A=jitter(IV[a]),B=jitter(IV[b]),C=jitter(IV[c]);
  // flat normal
  const u=[B[0]-A[0],B[1]-A[1],B[2]-A[2]];
  const w=[C[0]-A[0],C[1]-A[1],C[2]-A[2]];
  let n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];
  const ln=Math.hypot(...n)||1; n=n.map(x=>x/ln);
  for(const P of [A,B,C]) VP.push(P[0],P[1],P[2],n[0],n[1],n[2],fi);
  fi++;
}

// 【真光路 · 2026-11-26】预计算的面表：每个面沿 -法线 射进去打到谁，以及那一面往后的第二跳
const FACE_NEXT = [55, 72, 73, 72, 52, 73, 69, 50, 40, 67, 26, 65, 43, 60, 61, 41, 59, 58, 57, 59, 70, 35, 70, 32, 75, 72, 75, 75, 57, 76, 79, 79, 61, 60, 63, 63, 26, 66, 66, 66, 14, 32, 35, 32, 11, 33, 9, 10, 7, 20, 62, 5, 1, 24, 1, 1, 19, 18, 17, 19, 35, 35, 35, 35, 39, 75, 72, 72, 62, 23, 61, 21, 27, 27, 27, 27, 29, 28, 31, 31];
const FACE_NORMALS = [[-0.6172, 0.718, 0.3218], [-0.7397, 0.2172, 0.6369], [-0.312, 0.4831, 0.8181], [-0.5701, 0.4888, 0.6604], [-0.4043, 0.8828, 0.2392], [-0.0314, 0.6654, 0.7458], [0.3332, 0.9079, 0.2542], [-0.034, 0.877, 0.4794], [-0.405, 0.8842, -0.2326], [0.3237, 0.8821, -0.3422], [0.0399, 0.6946, -0.7183], [0.0424, 0.858, -0.5119], [-0.6173, 0.7208, -0.3154], [-0.2666, 0.5131, -0.8159], [-0.7601, 0.2391, -0.6042], [-0.5813, 0.5212, -0.6248], [-0.789, 0.6143, 0.0049], [-0.9476, 0.1444, -0.2849], [-0.9368, 0.1254, 0.3266], [-0.958, 0.2866, 0.0046], [0.6961, 0.6038, 0.3885], [0.3132, 0.4478, 0.8375], [0.7444, 0.2953, 0.5989], [0.6525, 0.4468, 0.6121], [-0.188, 0.2253, 0.956], [-0.6218, 0.0029, 0.7831], [-0.205, -0.198, 0.9585], [-0.3474, 0.0029, 0.9377], [-0.9389, -0.1062, 0.3273], [-0.9506, -0.1215, -0.2858], [-0.7708, -0.6371, 0.009], [-0.9638, -0.2665, 0.0084], [-0.6265, -0.0098, -0.7793], [-0.1328, 0.2273, -0.9647], [-0.1683, -0.1994, -0.9654], [-0.3058, -0.0095, -0.9521], [0.3084, 0.5235, -0.7942], [0.6392, 0.6231, -0.4507], [0.7495, 0.3175, -0.5809], [0.6142, 0.5226, -0.5914], [0.6555, -0.6321, 0.4131], [0.7265, -0.279, 0.628], [0.3735, -0.4659, 0.8022], [0.6099, -0.464, 0.6425], [0.2199, -0.9431, 0.2495], [0.039, -0.6919, 0.7209], [-0.3008, -0.9432, 0.1411], [0.0415, -0.9313, 0.3618], [0.2203, -0.9447, -0.2429], [-0.2956, -0.9267, -0.232], [-0.0328, -0.7205, -0.6926], [-0.0345, -0.9164, -0.3988], [0.656, -0.6353, -0.4074], [0.329, -0.4982, -0.8022], [0.7469, -0.3005, -0.5931], [0.6217, -0.4964, -0.606], [0.8679, -0.4968, 0.0051], [0.9496, -0.1968, -0.2441], [0.9415, -0.1787, 0.2859], [0.9487, -0.3162, 0.0048], [0.2401, -0.1964, 0.9507], [0.5823, -0.0103, 0.8129], [0.2045, 0.2245, 0.9528], [0.3704, -0.0101, 0.9288], [-0.63, -0.7266, 0.274], [-0.3326, -0.4584, 0.8242], [-0.7361, -0.2009, 0.6464], [-0.577, -0.4626, 0.6731], [-0.3281, -0.5337, -0.7795], [-0.573, -0.7454, -0.3406], [-0.7427, -0.2239, -0.6311], [-0.5361, -0.5379, -0.6506], [0.5882, 0.0029, -0.8087], [0.1843, -0.1988, -0.9626], [0.1672, 0.2261, -0.9596], [0.3287, 0.0028, -0.9444], [0.9369, 0.203, 0.2845], [0.9454, 0.2171, -0.2431], [0.8812, 0.4726, 0.0095], [0.9415, 0.3369, 0.0092]];

function makeDataTex(w, bytes){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(bytes));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
const faceNextBytes = [];
for(let i=0;i<FACE_NEXT.length;i++) faceNextBytes.push(FACE_NEXT[i] & 255, 0, 0, 255);
const faceNormBytes = [];
for(let i=0;i<FACE_NORMALS.length;i++){
  const n = FACE_NORMALS[i];
  faceNormBytes.push(
    Math.round((n[0]*0.5+0.5)*255),
    Math.round((n[1]*0.5+0.5)*255),
    Math.round((n[2]*0.5+0.5)*255), 255);
}
const texNext = makeDataTex(FACE_NEXT.length, faceNextBytes);
const texNorm = makeDataTex(FACE_NORMALS.length, faceNormBytes);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(VP),gl.STATIC_DRAW);
const aPos=gl.getAttribLocation(pr,'aPos'),aNrm=gl.getAttribLocation(pr,'aNrm'),
      aFace=gl.getAttribLocation(pr,'aFace');
gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,28,0);
gl.enableVertexAttribArray(aNrm);gl.vertexAttribPointer(aNrm,3,gl.FLOAT,false,28,12);
gl.enableVertexAttribArray(aFace);gl.vertexAttribPointer(aFace,1,gl.FLOAT,false,28,24);

const uMVP=gl.getUniformLocation(pr,'uMVP'),uNM=gl.getUniformLocation(pr,'uNM'),
      uT=gl.getUniformLocation(pr,'uT'),uTime=gl.getUniformLocation(pr,'uTime'),
      uRes=gl.getUniformLocation(pr,'uRes'),
      uPass=gl.getUniformLocation(pr,'uPass'),
      uFaceTex=gl.getUniformLocation(pr,'uFaceTex'),
      uNormTex=gl.getUniformLocation(pr,'uNormTex');

gl.enable(gl.DEPTH_TEST);

function mul(a,b){const o=new Float32Array(16);
 for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;
  for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o;}
function persp(fovy,asp,n,f){const t=1/Math.tan(fovy/2);const o=new Float32Array(16);
 o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
function rotY(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array(
 [c,0,-s,0, 0,1,0,0, s,0,c,0, 0,0,0,1]);}
function rotX(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array(
 [1,0,0,0, 0,c,s,0, 0,-s,c,0, 0,0,0,1]);}
function transZ(z){const o=new Float32Array(16);o[0]=o[5]=o[10]=o[15]=1;o[14]=z;return o;}
function nm3(m){return new Float32Array([m[0],m[4],m[8],m[1],m[5],m[9],m[2],m[6],m[10]]);}

let turb=0.62;
const r=document.getElementById('r'),tb=document.getElementById('tb'),cl=document.getElementById('cl');
r.addEventListener('input',()=>{turb=r.value/100;tb.textContent=r.value+'%';
  cl.textContent=turb<0.25?'S3':turb<0.5?'S7':turb<0.75?'S11':turb<0.9?'S15':'S19';});
function resize(){const d=Math.min(devicePixelRatio||1,2);
 cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();

// 【旋转控制 · 2026-11-26 宝："旋转速度看得好烦，能手动转吗"】
// 自动转速 0.22 → 0.45（一圈从 28 秒缩到 14 秒），并支持拖动直接转。
let spinSpeed = 0.45;
let spinBase = 0, lastT = 0;
let dragX = 0, dragY = 0;
let dragging = false, lastX = 0, lastY = 0;

cv.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch(_) {}
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  dragY += (e.clientX - lastX) * 0.009;
  dragX += (e.clientY - lastY) * 0.009;
  dragX = Math.max(-1.1, Math.min(1.1, dragX));   // 上下夹住，别翻过去
  lastX = e.clientX; lastY = e.clientY;
});
const endDrag = () => { dragging = false; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', endDrag);

const t0=performance.now();
function loop(now){
  const t=(now-t0)/1000;
  const dt=t-lastT; lastT=t;
  if(!dragging) spinBase += dt * spinSpeed;      // 拖的时候停自动转，手感才对
  const asp=cv.width/cv.height;
  const proj=persp(0.62,asp,0.1,10);
  const view=transZ(-2.05);
  const model=mul(rotX(-0.14+dragX),rotY(spinBase+dragY));
  const mv=mul(view,model);
  const mvp=mul(proj,mv);
  gl.uniformMatrix4fv(uMVP,false,mvp);
  gl.uniformMatrix3fv(uNM,false,nm3(mv));
  gl.uniform1f(uT,turb);
  gl.uniform1f(uTime,t);
  gl.uniform2f(uRes,cv.width,cv.height);
  // 面表贴图（真光路用）
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texNext);
  gl.uniform1i(uFaceTex, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, texNorm);
  gl.uniform1i(uNormTex, 1);

  gl.clearColor(0.042,0.036,0.072,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  const n=VP.length/6;
  // pass 1：背面（只画背面，写深度）
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.FRONT);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.uniform1f(uPass,1.0);
  gl.drawArrays(gl.TRIANGLES,0,n);

  // pass 2：正面（半透明混合，不写深度）
  gl.cullFace(gl.BACK);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.uniform1f(uPass,0.0);
  gl.drawArrays(gl.TRIANGLES,0,n);
  gl.depthMask(true);
  gl.disable(gl.BLEND);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
